const Notifications = {
  push(userId, type, refType, refId, params) {
    if (!userId) return;
    const target = U.byId(Store.state.users, userId);
    if (!target || target.status !== 'active') return;
    Store.state.notifications.push({
      id: U.uid('ntf'), at: U.nowISO(),
      userId, type, refType: refType || null, refId: refId || null,
      params: params || {}, read: false
    });
    if (Store.state.notifications.length > 3000) Store.state.notifications.splice(0, Store.state.notifications.length - 3000);
  },
  notifyUsers(userIds, type, refType, refId, params) {
    (userIds || []).forEach(id => this.push(id, type, refType, refId, params));
    Store.markDirty();
  },
  forCurrentUser() {
    const uid = Auth.currentUserId();
    return Store.state.notifications.filter(n => n.userId === uid).sort((a, b) => U.cmp(b.at, a.at));
  },
  unreadCount() {
    const uid = Auth.currentUserId();
    return Store.state.notifications.filter(n => n.userId === uid && !n.read).length;
  },
  markRead(id) {
    const n = U.byId(Store.state.notifications, id);
    if (n && n.userId === Auth.currentUserId()) { n.read = true; Store.markDirty(); }
  },
  markAllRead() {
    const uid = Auth.currentUserId();
    Store.state.notifications.forEach(n => { if (n.userId === uid) n.read = true; });
    Store.markDirty();
  },
  label(n) {
    const key = 'notif_' + n.type;
    return t(key, n.params || {});
  }
};

const Projects = {
  create(data) {
    Perms.assert('projects', 'create');
    if (!data.title || !data.title.trim()) throw new Error(t('required'));
    this.validateDates(data);
    const p = {
      id: U.uid('prj'), seq: Store.nextSeq('project'),
      title: data.title.trim(),
      description: data.description || '',
      objectives: data.objectives || '',
      managerEmployeeId: data.managerEmployeeId || null,
      memberIds: data.memberIds || [],
      departmentId: data.departmentId || null,
      teamId: data.teamId || null,
      startDate: data.startDate || null,
      endDate: data.endDate || null,
      targetDate: data.targetDate || null,
      priority: data.priority || 'medium',
      status: data.status || Store.state.settings.defaultProjectStatus || 'active',
      tags: data.tags || [],
      archived: false,
      createdAt: U.nowISO(),
      createdBy: Auth.currentUserId()
    };
    Store.state.projects.push(p);
    Store.audit('createProject', 'project:' + p.id, null, p.title);
    Store.markDirty();
    return p;
  },
  validateDates(data) {
    for (const k of ['startDate', 'endDate', 'targetDate']) {
      if (data[k] && !Cal.parseISO(data[k])) throw new Error(t('invalidValue') + ' (' + t(k === 'targetDate' ? 'targetDate' : k) + ')');
    }
    if (data.startDate && data.endDate && Cal.diffDays(data.endDate, data.startDate) < 0) {
      throw new Error(t('invalidValue') + ' (' + t('endDate') + ')');
    }
  },
  update(id, data) {
    const p = this.get(id);
    Perms.assert('projects', 'edit', p);
    if (!data.title || !data.title.trim()) throw new Error(t('required'));
    this.validateDates(data);
    const prev = p.title;
    p.title = data.title.trim();
    p.description = data.description || '';
    p.objectives = data.objectives || '';
    p.managerEmployeeId = data.managerEmployeeId || null;
    const oldMembers = p.memberIds || [];
    p.memberIds = data.memberIds || [];
    p.departmentId = data.departmentId || null;
    p.teamId = data.teamId || null;
    p.startDate = data.startDate || null;
    p.endDate = data.endDate || null;
    p.targetDate = data.targetDate || null;
    p.priority = data.priority || 'medium';
    if (data.status && data.status !== p.status) {
      Workflow.validate('project', p.status, data.status, p);
      p.status = data.status;
    }
    p.tags = data.tags || [];
    Store.audit('updateProject', 'project:' + p.id, prev, p.title);
    const added = p.memberIds.filter(m => !oldMembers.includes(m));
    if (added.length) {
      Notifications.notifyUsers(
        added.map(eid => { const e = Employees.get(eid); return e ? e.userId : null; }).filter(Boolean),
        'projectChange', 'project', p.id, { title: p.title }
      );
    }
    Store.markDirty();
    return p;
  },
  get(id) {
    const p = U.byId(Store.state.projects, id);
    if (!p) throw new Error(t('notFound'));
    Perms.assert('projects', 'view', p);
    return p;
  },
  visible() { return Perms.visible('projects', Store.state.projects.filter(p => !p.archived)); },
  archivedList() { return Perms.visible('projects', Store.state.projects.filter(p => p.archived)); },
  setArchived(id, archived) {
    const p = this.get(id);
    Perms.assert('projects', archived ? 'archive' : 'restore', p);
    p.archived = archived;
    Store.audit(archived ? 'archiveProject' : 'restoreProject', 'project:' + p.id, null, p.title);
    Store.markDirty();
    return p;
  },
  delete(id) {
    const p = this.get(id);
    Perms.assert('projects', 'delete', p);
    const taskIds = Store.state.tasks.filter(x => x.projectId === id).map(x => x.id);
    Store.state.tasks = Store.state.tasks.filter(x => x.projectId !== id);
    Store.state.projects = Store.state.projects.filter(x => x.id !== id);
    Store.audit('deleteProject', 'project:' + id, p.title, null);
    Store.markDirty();
    return taskIds.length;
  },
  progress(p) {
    const tasks = Store.state.tasks.filter(x => x.projectId === p.id && !x.archived && !x.parentId);
    if (!tasks.length) {
      return Workflow.kindOf('project', p.status) === 'done' ? 100 : 0;
    }
    const sum = tasks.reduce((acc, x) => acc + U.num(x.progress), 0);
    return Math.round(sum / tasks.length);
  },
  isDelayed(p) {
    if (Workflow.kindOf('project', p.status) === 'done') return false;
    const today = Cal.todayISO();
    if (p.endDate && Cal.diffDays(today, p.endDate) > 0) return true;
    if (p.targetDate && Cal.diffDays(today, p.targetDate) > 0) return true;
    return false;
  },
  addMilestone(projectId, m) {
    const p = this.get(projectId);
    Perms.assert('projects', 'edit', p);
    if (!m.title || !m.title.trim()) throw new Error(t('required'));
    if (m.dueDate && !Cal.parseISO(m.dueDate)) throw new Error(t('invalidValue'));
    const ms = {
      id: U.uid('ms'), title: m.title.trim(),
      dueDate: m.dueDate || null, done: !!m.done,
      createdAt: U.nowISO()
    };
    Store.state.milestones.push(Object.assign({ projectId: p.id }, ms));
    Store.audit('createMilestone', 'milestone:' + ms.id, null, ms.title);
    Store.markDirty();
    return ms;
  },
  toggleMilestone(mid) {
    const ms = U.byId(Store.state.milestones, mid);
    if (!ms) throw new Error(t('notFound'));
    const p = this.get(ms.projectId);
    Perms.assert('projects', 'edit', p);
    ms.done = !ms.done;
    ms.doneAt = ms.done ? U.nowISO() : null;
    Store.markDirty();
    return ms;
  },
  deleteMilestone(mid) {
    const ms = U.byId(Store.state.milestones, mid);
    if (!ms) throw new Error(t('notFound'));
    const p = this.get(ms.projectId);
    Perms.assert('projects', 'edit', p);
    Store.state.milestones = Store.state.milestones.filter(x => x.id !== mid);
    Store.markDirty();
  },
  projectMilestones(projectId) { return Store.state.milestones.filter(m => m.projectId === projectId); }
};

const Tasks = {
  create(data) {
    Perms.assert('tasks', 'create', data.parentId ? this.raw(data.parentId) : null);
    if (!data.title || !data.title.trim()) throw new Error(t('required'));
    if (data.projectId && !this.projectVisible(data.projectId)) throw new Error('permDenied');
    if (data.dueDate && !Cal.parseISO(data.dueDate)) throw new Error(t('invalidValue'));
    if (data.startDate && !Cal.parseISO(data.startDate)) throw new Error(t('invalidValue'));
    const task = {
      id: U.uid('tsk'), seq: Store.nextSeq('task'),
      title: data.title.trim(),
      description: data.description || '',
      projectId: data.projectId || null,
      parentId: data.parentId || null,
      creatorId: Auth.currentUserId(),
      assigneeIds: data.assigneeIds || [],
      reviewerId: data.reviewerId || null,
      priority: data.priority || 'medium',
      status: data.status || Store.state.settings.defaultTaskStatus || 'todo',
      stage: data.stage || '',
      progress: 0,
      startDate: data.startDate || null,
      dueDate: data.dueDate || null,
      completedAt: null,
      resultSummary: '',
      tags: data.tags || [],
      custom: data.custom || {},
      deps: data.deps || [],
      attachments: [],
      comments: [],
      updates: [],
      history: [],
      archived: false,
      createdAt: U.nowISO()
    };
    this.addHistory(task, 'create', { title: task.title });
    Store.state.tasks.push(task);
    Store.audit('createTask', 'task:' + task.id, null, task.title);
    this.notifyAssignees(task, 'taskAssigned', (task.assigneeIds || []));
    Store.markDirty();
    return task;
  },
  projectVisible(projectId) {
    const p = U.byId(Store.state.projects, projectId);
    return p && Perms.can('projects', 'view', p);
  },
  raw(id) { return U.byId(Store.state.tasks, id); },
  get(id) {
    const x = this.raw(id);
    if (!x) throw new Error(t('notFound'));
    Perms.assert('tasks', 'view', x);
    return x;
  },
  visible() { return Perms.visible('tasks', Store.state.tasks.filter(x => !x.archived)); },
  addHistory(task, action, details) {
    task.history = task.history || [];
    task.history.push({ at: U.nowISO(), actorId: Auth.currentUserId(), action, details: details || {} });
    if (task.history.length > 300) task.history.splice(0, task.history.length - 300);
  },
  notifyAssignees(task, type, onlyIds) {
    const ids = onlyIds || task.assigneeIds || [];
    const userIds = ids.map(eid => {
      const e = Employees.get(eid);
      return e && e.userId ? e.userId : null;
    }).filter(id => id && id !== Auth.currentUserId());
    Notifications.notifyUsers(userIds, type, 'task', task.id, { title: task.title });
  },
  update(id, data) {
    const task = this.get(id);
    Perms.assert('tasks', 'edit', task);
    if (!data.title || !data.title.trim()) throw new Error(t('required'));
    if (data.dueDate && !Cal.parseISO(data.dueDate)) throw new Error(t('invalidValue'));
    const prevAssignees = task.assigneeIds || [];
    task.title = data.title.trim();
    task.description = data.description || '';
    if (data.projectId !== undefined) task.projectId = data.projectId || null;
    task.assigneeIds = data.assigneeIds || [];
    task.reviewerId = data.reviewerId || null;
    task.priority = data.priority || task.priority;
    if (data.stage !== undefined) task.stage = data.stage;
    if (data.startDate !== undefined) task.startDate = data.startDate || null;
    if (data.dueDate !== undefined) task.dueDate = data.dueDate || null;
    if (data.tags !== undefined) task.tags = data.tags || [];
    if (data.custom !== undefined) task.custom = data.custom || {};
    if (data.deps !== undefined) {
      if ((data.deps || []).includes(task.id)) throw new Error(t('invalidValue'));
      task.deps = data.deps || [];
    }
    if (data.status && data.status !== task.status) this.setStatus(task, data.status, { viaEdit: true });
    if (data.resultSummary !== undefined) task.resultSummary = data.resultSummary;
    this.addHistory(task, 'update', {});
    const added = task.assigneeIds.filter(a => !prevAssignees.includes(a));
    if (added.length) this.notifyAssignees(task, 'taskReassigned', added);
    Store.audit('updateTask', 'task:' + task.id, null, task.title);
    Store.markDirty();
    return task;
  },
  setStatus(task, statusId, opts) {
    opts = opts || {};
    if (!opts.skipPerm) Perms.assert('tasks', 'edit', task);
    const from = task.status;
    Workflow.validate('task', from, statusId, task);
    task.status = statusId;
    const kind = Workflow.kindOf('task', statusId);
    if (kind === 'done') {
      task.completedAt = U.nowISO();
      task.progress = 100;
    } else if (from && Workflow.kindOf('task', from) === 'done' && kind !== 'done') {
      task.completedAt = null;
      if (U.num(task.progress) >= 100) task.progress = 90;
    }
    this.addHistory(task, 'status', { from, to: statusId });
    Store.audit('taskStatus', 'task:' + task.id, from, statusId);
    const reviewer = task.reviewerId ? Employees.get(task.reviewerId) : null;
    if (reviewer && reviewer.userId && statusId === 'review') {
      Notifications.push(reviewer.userId, 'approval', 'task', task.id, { title: task.title });
    }
    Store.markDirty();
    return task;
  },
  /* checkbox auto-completion */
  setCompleted(id, completed) {
    const task = this.get(id);
    if (completed) {
      const wf = Store.state.workflow.task || {};
      if (wf.requireResultOnDone && !(task.resultSummary || '').trim()) {
        const err = new Error(t('resultSummary') + ': ' + t('required'));
        err.code = 'resultRequired';
        throw err;
      }
      const doneId = this.doneStatusId();
      if (!Workflow.canTransition('task', task.status, doneId)) {
        const staged = (Workflow.transitions('task')[task.status] || []).find(s => Workflow.kindOf('task', s) === 'active');
        if (staged) this.setStatus(task, staged, { skipPerm: true });
      }
      this.setStatus(task, doneId, { skipPerm: true });
      this.addHistory(task, 'complete', {});
      Store.audit('completeTask', 'task:' + task.id, null, task.title);
    } else {
      this.reopen(task);
    }
    Store.markDirty();
    return task;
  },
  doneStatusId() {
    const s = Store.state.statuses.task.find(x => x.kind === 'done');
    return s ? s.id : 'done';
  },
  reopen(task) {
    if (Workflow.kindOf('task', task.status) !== 'done') return task;
    const allowed = (Workflow.transitions('task')[task.status] || []).find(s => Workflow.kindOf('task', s) === 'active');
    const to = allowed || 'inprogress';
    Workflow.validate('task', task.status, to, task);
    task.status = to;
    task.completedAt = null;
    if (U.num(task.progress) >= 100) task.progress = 90;
    this.addHistory(task, 'reopen', { to });
    Store.audit('reopenTask', 'task:' + task.id, null, task.title);
    Store.markDirty();
    return task;
  },
  assign(id, assigneeIds) {
    const task = this.get(id);
    Perms.assert('tasks', 'assign', task);
    const prev = task.assigneeIds || [];
    task.assigneeIds = assigneeIds || [];
    this.addHistory(task, 'assign', { from: prev, to: task.assigneeIds });
    this.notifyAssignees(task, 'taskAssigned', task.assigneeIds.filter(a => !prev.includes(a)));
    Store.audit('assignTask', 'task:' + task.id, prev.join(','), task.assigneeIds.join(','));
    Store.markDirty();
    return task;
  },
  addProgressUpdate(id, upd) {
    const task = this.get(id);
    const isSelf = (task.assigneeIds || []).includes(Auth.currentUser() && Auth.currentUser().employeeId);
    if (!(isSelf || Perms.can('tasks', 'edit', task))) throw new Error('permDenied');
    if (!upd.description || !upd.description.trim()) throw new Error(t('required'));
    const progress = U.clamp(U.num(upd.progress, task.progress), 0, 100);
    const entry = {
      id: U.uid('upd'), at: U.nowISO(),
      authorId: Auth.currentUserId(),
      description: upd.description.trim(),
      progress,
      stage: upd.stage !== undefined ? upd.stage : task.stage,
      status: upd.status || null,
      result: upd.result || '',
      problems: upd.problems || '',
      nextSteps: upd.nextSteps || ''
    };
    const snapshot = U.clone(task);
    try {
      task.updates.push(entry);
      if (entry.stage !== undefined && entry.stage !== task.stage) {
        task.stage = entry.stage;
        this.addHistory(task, 'stage', { to: entry.stage });
      }
      if (entry.result) task.resultSummary = entry.result;
      if (entry.status && entry.status !== task.status) {
        this.setStatus(task, entry.status, {});
      }
      if (Workflow.kindOf('task', task.status) !== 'done') {
        task.progress = progress;
      }
      this.addHistory(task, 'progress', { progress, id: entry.id });
      const manager = task.projectId ? U.byId(Store.state.projects, task.projectId) : null;
      if (manager && manager.managerEmployeeId) {
        const me = Employees.get(manager.managerEmployeeId);
        if (me && me.userId && me.userId !== Auth.currentUserId()) {
          Notifications.push(me.userId, 'progress', 'task', task.id, { title: task.title });
        }
      }
      Store.markDirty();
      return entry;
    } catch (e) {
      const idx = Store.state.tasks.indexOf(task);
      if (idx >= 0) Store.state.tasks[idx] = snapshot;
      throw e;
    }
  },
  deleteUpdate(id, updId) {
    const task = this.get(id);
    if (!Perms.can('tasks', 'approve', task)) throw new Error('permDenied');
    const upd = U.byId(task.updates, updId);
    if (!upd) throw new Error(t('notFound'));
    task.updates = task.updates.filter(x => x.id !== updId);
    this.addHistory(task, 'deleteUpdate', { id: updId });
    Store.audit('deleteProgressUpdate', 'task:' + task.id, null, updId);
    Store.markDirty();
  },
  addComment(id, text) {
    const task = this.get(id);
    if (!text || !text.trim()) throw new Error(t('required'));
    const c = { id: U.uid('cmt'), at: U.nowISO(), authorId: Auth.currentUserId(), text: text.trim() };
    task.comments.push(c);
    this.addHistory(task, 'comment', {});
    const userIds = (task.assigneeIds || []).map(eid => {
      const e = Employees.get(eid);
      return e && e.userId ? e.userId : null;
    }).filter(uid => uid && uid !== Auth.currentUserId());
    Notifications.notifyUsers(userIds, 'comment', 'task', task.id, { title: task.title });
    Store.markDirty();
    return c;
  },
  addAttachment(id, att) {
    const task = this.get(id);
    Perms.assert('tasks', 'edit', task);
    if (!att.name || !att.content) throw new Error(t('required'));
    if (String(att.content).length > 512 * 1024) throw new Error(t('attachmentTooLarge'));
    if (/[\\/:*?"<>|]/.test(att.name) || att.name.includes('..')) throw new Error(t('invalidValue'));
    const a = { id: U.uid('att'), name: att.name, size: att.content.length, content: att.content, at: U.nowISO(), byId: Auth.currentUserId() };
    task.attachments.push(a);
    this.addHistory(task, 'attachment', { name: att.name });
    Store.markDirty();
    return a;
  },
  setProgress(id, progress) {
    const task = this.get(id);
    Perms.assert('tasks', 'edit', task);
    task.progress = U.clamp(U.num(progress), 0, 100);
    this.addHistory(task, 'progress', { progress: task.progress });
    Store.markDirty();
    return task;
  },
  isBlocked(task) {
    return (task.deps || []).some(depId => {
      const dep = this.raw(depId);
      return dep && Workflow.kindOf('task', dep.status) !== 'done' && Workflow.kindOf('task', dep.status) !== 'cancelled';
    });
  },
  isOverdue(task) {
    return !!task.dueDate && Workflow.kindOf('task', task.status) !== 'done' &&
      Workflow.kindOf('task', task.status) !== 'cancelled' && Cal.diffDays(Cal.todayISO(), task.dueDate) > 0;
  },
  delete(id) {
    const task = this.get(id);
    Perms.assert('tasks', 'delete', task);
    const childIds = Store.state.tasks.filter(x => x.parentId === id).map(x => x.id);
    Store.state.tasks = Store.state.tasks.filter(x => x.id !== id && x.parentId !== id);
    Store.state.tasks.forEach(x => { x.deps = (x.deps || []).filter(d => d !== id && !childIds.includes(d)); });
    Store.audit('deleteTask', 'task:' + id, task.title, null);
    Store.markDirty();
    return 1 + childIds.length;
  },
  setArchived(id, archived) {
    const task = this.get(id);
    Perms.assert('tasks', 'edit', task);
    task.archived = archived;
    Store.markDirty();
    return task;
  },
  subtasks(id) { return Store.state.tasks.filter(x => x.parentId === id && !x.archived); }
};

/* ===== 45-search.js ===== */
/* ===== Global search (permission-aware) ===== */
const Search = {
  normalize(s) { return String(s || '').toLowerCase().trim(); },
  run(q) {
    q = this.normalize(q);
    if (!q) return { projects: [], tasks: [], employees: [], users: [] };
    const out = { projects: [], tasks: [], employees: [], users: [] };
    out.projects = Perms.visible('projects', Store.state.projects).filter(p =>
      this.normalize(p.title).includes(q) || this.normalize(p.description).includes(q) ||
      (p.tags || []).some(x => this.normalize(x).includes(q))).slice(0, 20);
    out.tasks = Perms.visible('tasks', Store.state.tasks).filter(x =>
      this.normalize(x.title).includes(q) || this.normalize(x.description).includes(q) ||
      (x.tags || []).some(tag => this.normalize(tag).includes(q))).slice(0, 20);
    if (Perms.can('employees', 'view')) {
      out.employees = Store.state.employees.filter(e =>
        this.normalize(e.fullName).includes(q) || this.normalize(e.empNo).includes(q) ||
        this.normalize(e.jobTitle).includes(q)).slice(0, 20);
    }
    if (Perms.can('users', 'view')) {
      out.users = Store.state.users.filter(u =>
        this.normalize(u.username).includes(q) || this.normalize(u.displayName).includes(q)).slice(0, 20);
    }
    return out;
  }
};

/* ===== Reports ===== */
const Reports = {
  definitions() {
    return [
      { id: 'projectStatus', key: 'report_projectStatus' },
      { id: 'taskStatus', key: 'report_taskStatus' },
      { id: 'overdue', key: 'report_overdue' },
      { id: 'workload', key: 'report_workload' },
      { id: 'completion', key: 'report_completion' },
      { id: 'updates', key: 'report_updates' },
      { id: 'milestones', key: 'report_milestones' },
      { id: 'activity', key: 'report_activity' }
    ];
  },
  run(id, filters) {
    filters = filters || {};
    const today = Cal.todayISO();
    if (id === 'projectStatus') {
      const rows = Perms.visible('projects', Store.state.projects).filter(p => !filters.projectId || p.id === filters.projectId);
      return {
        head: [t('project'), t('status'), t('priority'), t('progress'), t('startDate'), t('endDate'), t('department')],
        rows: rows.map(p => [
          p.title, Workflow.statusLabel('project', p.status), Priorities.label(p.priority),
          Projects.progress(p) + '%',
          p.startDate ? Cal.formatISO(p.startDate, I18N.getLang()) : '—',
          p.endDate ? Cal.formatISO(p.endDate, I18N.getLang()) : '—',
          this.deptName(p.departmentId)
        ])
      };
    }
    if (id === 'taskStatus') {
      const rows = Perms.visible('tasks', Store.state.tasks).filter(x => !x.parentId)
        .filter(x => !filters.projectId || x.projectId === filters.projectId)
        .filter(x => !filters.employeeId || (x.assigneeIds || []).includes(filters.employeeId));
      return {
        head: [t('task'), t('project'), t('status'), t('stage'), t('progress'), t('dueDate'), t('assignee')],
        rows: rows.map(x => [
          x.title, this.projectName(x.projectId), Workflow.statusLabel('task', x.status), x.stage || '—',
          U.num(x.progress) + '%',
          x.dueDate ? Cal.formatISO(x.dueDate, I18N.getLang()) : '—',
          this.assigneeNames(x)
        ])
      };
    }
    if (id === 'overdue') {
      const rows = Perms.visible('tasks', Store.state.tasks).filter(x => Tasks.isOverdue(x));
      return {
        head: [t('task'), t('project'), t('dueDate'), t('daysLate'), t('assignee'), t('priority')],
        rows: rows.map(x => [
          x.title, this.projectName(x.projectId),
          Cal.formatISO(x.dueDate, I18N.getLang()),
          Cal.diffDays(today, x.dueDate),
          this.assigneeNames(x), Priorities.label(x.priority)
        ])
      };
    }
    if (id === 'workload') {
      const emps = Perms.visible('employees', Store.state.employees).filter(e => e.status === 'active');
      return {
        head: [t('employee'), t('employeeNo'), t('department'), t('assignedTasks'), t('overdue'), t('completed')],
        rows: emps.map(e => {
          const mine = Store.state.tasks.filter(x => (x.assigneeIds || []).includes(e.id) && !x.archived);
          return [e.fullName, e.empNo, this.deptName(e.departmentId),
            mine.filter(x => Workflow.kindOf('task', x.status) !== 'done' && Workflow.kindOf('task', x.status) !== 'cancelled').length,
            mine.filter(x => Tasks.isOverdue(x)).length,
            mine.filter(x => Workflow.kindOf('task', x.status) === 'done').length];
        })
      };
    }
    if (id === 'completion') {
      const rows = Perms.visible('tasks', Store.state.tasks).filter(x => x.completedAt);
      return {
        head: [t('task'), t('project'), t('completedAt'), t('resultSummary'), t('assignee')],
        rows: rows.sort((a, b) => U.cmp(b.completedAt, a.completedAt)).map(x => [
          x.title, this.projectName(x.projectId),
          Cal.formatTimestamp(x.completedAt, I18N.getLang(), false),
          x.resultSummary || '—', this.assigneeNames(x)
        ])
      };
    }
    if (id === 'updates') {
      const rows = [];
      Perms.visible('tasks', Store.state.tasks).forEach(x => {
        (x.updates || []).forEach(u => rows.push({ task: x, u }));
      });
      rows.sort((a, b) => U.cmp(b.u.at, a.u.at));
      return {
        head: [t('task'), t('date'), t('auditActor'), t('progress'), t('workDone'), t('problems'), t('nextSteps')],
        rows: rows.map(r => [
          r.task.title, Cal.formatTimestamp(r.u.at, I18N.getLang()),
          this.userName(r.u.authorId), r.u.progress + '%',
          r.u.description, r.u.problems || '—', r.u.nextSteps || '—'
        ])
      };
    }
    if (id === 'milestones') {
      const rows = [];
      Perms.visible('projects', Store.state.projects).forEach(p => {
        Projects.projectMilestones(p.id).forEach(m => rows.push({ p, m }));
      });
      return {
        head: [t('milestone'), t('project'), t('dueDate'), t('status')],
        rows: rows.map(r => [
          r.m.title, r.p.title,
          r.m.dueDate ? Cal.formatISO(r.m.dueDate, I18N.getLang()) : '—',
          r.m.done ? t('completed') : (r.m.dueDate && Cal.diffDays(today, r.m.dueDate) > 0 ? t('overdue') : t('pending'))
        ])
      };
    }
    if (id === 'activity') {

          Cal.formatTimestamp(a.at, I18N.getLang()),
          this.userName(a.actorId), a.action, a.target
        ])
      };
    }
    return { head: [], rows: [] };
  },
  deptName(id) {
    const d = U.byId(Store.state.departments, id);
    return d ? d.name : '—';
  },
  projectName(id) {

    return p ? p.title : '—';

  assigneeNames(task) {

  exportCsv(report) {

};

/* ===== 50-backup.js ===== */
/* ===== Backup, migration engine, restore ===== */
const BACKUP_FORMAT_VERSION = 1;

const Migrations = {
  list: [
    {
      from: 1, to: 2,
      description: 'Add announcements collection (Atlas-patch1 schema)',
      run(data) {
        if (!data.announcements) data.announcements = [];
        return data;
      }
    }
  ],
  apply(data, targetVersion) {
    let v = data.meta && data.meta.schemaVersion ? data.meta.schemaVersion : 1;
    const applied = [];
    while (v < targetVersion) {
      const m = this.list.find(x => x.from === v);
      if (!m) throw new Error('No migration from schema ' + v);
      m.run(data);
      v = m.to;
      applied.push({ from: m.from, to: m.to, description: m.description, at: U.nowISO() });
    }
    data.meta.schemaVersion = targetVersion;
    if (data.meta.migrationHistory) data.meta.migrationHistory.push(...applied);
    else data.meta.migrationHistory = applied;
    return applied;
  },
  canRestore(sourceVersion) {
    let v = sourceVersion;
    while (v < SCHEMA_VERSION) {
      const m = this.list.find(x => x.from === v);
      if (!m) return { ok: false, at: v };
      v = m.to;
    }
    return { ok: true, from: sourceVersion, to: SCHEMA_VERSION };
  }
};

const Backup = {
  COLLECTIONS: ['users', 'roles', 'employees', 'departments', 'teams', 'projects', 'tasks', 'milestones', 'notifications', 'auditLog', 'customFields', 'announcements', 'patchHistory'],

  create() {
    const s = Store.state;
    const backup = {
      format: 'atlas-backup',
      formatVersion: BACKUP_FORMAT_VERSION,
      appVersion: APP_VERSION,
      schemaVersion: s.meta.schemaVersion,
      createdAt: U.nowISO(),
      inventory: {},
      integrity: { recordCount: 0 },
      data: {}
    };
    let count = 0;
    this.COLLECTIONS.forEach(c => {
      const arr = Array.isArray(s[c]) ? s[c] : [];
      backup.data[c] = U.clone(arr);
      backup.inventory[c] = arr.length;
      count += arr.length;
    });
    backup.data.settings = U.clone(s.settings);
    backup.data.workflow = U.clone(s.workflow);
    backup.data.statuses = U.clone(s.statuses);
    backup.data.priorities = U.clone(s.priorities);
    backup.data.customFields = U.clone(s.customFields || []);
    backup.data.meta = U.clone(s.meta);
    backup.data.activePatchPayloads = U.clone(s.activePatchPayloads || {});
    backup.inventory.settings = 1;
    backup.inventory.activePatchPayloads = Object.keys(backup.data.activePatchPayloads).length;
    backup.integrity.recordCount = count;
    backup.integrity.checksum = SHA256(JSON.stringify(backup.data));
    return backup;
  },

  validate(backup) {
    if (!backup || typeof backup !== 'object') return { ok: false, msg: 'not an object' };
    if (backup.format !== 'atlas-backup') return { ok: false, msg: 'format' };
    if (typeof backup.formatVersion !== 'number') return { ok: false, msg: 'formatVersion' };
    if (backup.formatVersion > BACKUP_FORMAT_VERSION) return { ok: false, msg: 'formatVersion too new: ' + backup.formatVersion };
    if (!backup.data || typeof backup.data !== 'object') return { ok: false, msg: 'data' };
    if (!backup.data.meta || typeof backup.data.meta.schemaVersion !== 'number') return { ok: false, msg: 'schemaVersion' };
    if (backup.integrity && backup.integrity.checksum) {
      const actual = SHA256(JSON.stringify(backup.data));
      if (actual !== backup.integrity.checksum) return { ok: false, msg: 'checksum' };
    }
    return { ok: true };
  },

  compat(backup) {
    const sv = backup.data.meta.schemaVersion;
    const m = Migrations.canRestore(sv);
    if (!m.ok) return { ok: false, msg: 'schema ' + sv };
    return { ok: true, migration: m.from < m.to, from: m.from, to: m.to };
  },

  /* staged, transactional restore with automatic recovery checkpoint */
  restore(backup, opts) {
    opts = opts || {};
    const check = this.validate(backup);
    if (!check.ok) throw new Error(t('backupInvalid', { msg: check.msg }));
    const compat = this.compat(backup);
    if (!compat.ok) throw new Error(t('backupIncompatible'));

    const checkpoint = this.create();
    const prev = U.clone(Store.state);
    try {
      const restored = Store.fresh();
      restored.meta = U.clone(backup.data.meta);
      this.COLLECTIONS.forEach(c => {
        if (Array.isArray(backup.data[c])) restored[c] = U.clone(backup.data[c]);
      });
      restored.settings = Object.assign({}, Store.fresh().settings, U.clone(backup.data.settings) || {});
      restored.workflow = Object.assign({}, Store.fresh().workflow, U.clone(backup.data.workflow) || {});
      restored.statuses = U.clone(backup.data.statuses) || Store.defaultStatuses();
      restored.priorities = U.clone(backup.data.priorities) || Store.defaultPriorities();
      restored.counters = U.clone(backup.data.counters) || Store.fresh().counters;
      restored.meta.installedPatches = U.clone((backup.data.meta && backup.data.meta.installedPatches) || []);
      restored.patchHistory = U.clone(backup.data.patchHistory) || [];
      restored.activePatchPayloads = U.clone(backup.data.activePatchPayloads) || {};

      if (compat.migration) {
        Migrations.apply(restored, SCHEMA_VERSION);
      }
      /* referential check */
      this.verify(restored);
      Store.state = restored;
      Store.persist();
      return { ok: true, checkpoint, migrated: compat.migration, counts: backup.inventory };
    } catch (e) {
      Store.state = prev;
      Store.persist();
      throw e;
    }
  },

  verify(s) {
    const userIds = new Set(s.users.map(u => u.id));
    const roleIds = new Set(s.roles.map(r => r.id));
    const empIds = new Set(s.employees.map(e => e.id));
    const projIds = new Set(s.projects.map(p => p.id));
    const taskIds = new Set(s.tasks.map(x => x.id));
    s.users.forEach(u => {
      (u.roles || []).forEach(r => { if (!roleIds.has(r)) throw new Error('broken role ref: ' + r); });
      if (u.employeeId && !empIds.has(u.employeeId)) u.employeeId = null;
    });
    s.employees.forEach(e => {
      if (e.departmentId && !s.departments.some(d => d.id === e.departmentId)) e.departmentId = null;
      if (e.teamId && !s.teams.some(tm => tm.id === e.teamId)) e.teamId = null;
      if (e.managerId && !empIds.has(e.managerId)) e.managerId = null;
    });
    s.projects.forEach(p => {
      if (p.managerEmployeeId && !empIds.has(p.managerEmployeeId)) p.managerEmployeeId = null;
      p.memberIds = (p.memberIds || []).filter(id => empIds.has(id));
      if (p.departmentId && !s.departments.some(d => d.id === p.departmentId)) p.departmentId = null;
    });
    s.tasks.forEach(x => {
      if (x.projectId && !projIds.has(x.projectId)) x.projectId = null;
      if (x.parentId && !taskIds.has(x.parentId)) x.parentId = null;
      x.deps = (x.deps || []).filter(d => taskIds.has(d) && d !== x.id);
      x.assigneeIds = (x.assigneeIds || []).filter(id => empIds.has(id));
    });
    s.milestones = (s.milestones || []).filter(m => projIds.has(m.projectId));
    return true;
  }
};

/* ===== 55-patch.js ===== */
/* ===== Patch Center ===== */
const PatchCenter = {
  TRUSTED_PUBLISHERS: ['atlas-official'],

  validate(pkg) {
    if (!pkg || typeof pkg !== 'object') return { ok: false, msg: t('patchBadFormat') };
    if (pkg.format !== 'atlas-patch') return { ok: false, msg: t('patchBadFormat') };
    const req = ['id', 'name', 'version', 'minAppVersion', 'payload'];
    for (const k of req) if (pkg[k] === undefined) return { ok: false, msg: t('patchBadFormat') + ' (' + k + ')' };
    if (!pkg.payload || (typeof pkg.payload.js !== 'string' && typeof pkg.payload.css !== 'string')) {
      return { ok: false, msg: t('patchBadFormat') + ' (payload)' };
    }
    if (pkg.integrity && pkg.integrity.payloadHash) {
      const actual = SHA256(JSON.stringify(pkg.payload));
      if (actual !== pkg.integrity.payloadHash) return { ok: false, msg: t('patchBadIntegrity') };
    }
    return { ok: true };
  },

  compat(pkg) {
    const cmpVer = (a, b) => {
      const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
      for (let i = 0; i < 3; i++) {
        const d = (pa[i] || 0) - (pb[i] || 0);
        if (d) return d;
      }
      return 0;
    };
    if (pkg.minAppVersion && cmpVer(APP_VERSION, pkg.minAppVersion) < 0) return { ok: false, msg: t('patchIncompatible', { app: APP_VERSION, min: pkg.minAppVersion, max: pkg.maxAppVersion || '?' }) };
    if (pkg.maxAppVersion && cmpVer(APP_VERSION, pkg.maxAppVersion) > 0) return { ok: false, msg: t('patchIncompatible', { app: APP_VERSION, min: pkg.minAppVersion, max: pkg.maxAppVersion }) };
    return { ok: true };
  },

  conflicts(pkg) {
    const installed = Store.state.meta.installedPatches || [];
    if ((pkg.conflicts || []).some(c => installed.some(p => p.id === c))) return { ok: false, msg: t('patchConflicts') };
    return { ok: true };
  },

  /* staged install: snapshot -> apply -> health check -> commit | auto-rollback */
  install(pkg) {
    Perms.assert('patch', 'install');
    let check = this.validate(pkg);
    if (!check.ok) throw new Error(check.msg);
    check = this.compat(pkg);
    if (!check.ok) throw new Error(check.msg);
    check = this.conflicts(pkg);
    if (!check.ok) throw new Error(check.msg);

    const snapshot = U.clone(Store.state);
    const snapshotActive = U.clone(Store.state.activePatchPayloads);
    try {
      /* migration */
      if (pkg.payload.migration && typeof pkg.payload.migration === 'object') {
        const m = pkg.payload.migration;
        if (m.toSchema > Store.state.meta.schemaVersion) {
          Migrations.apply(Store.state, m.toSchema);
        }
      }
      /* data operations */
      if (pkg.payload.dataOps) this.runDataOps(pkg.payload.dataOps);
      /* register payload for persistence + boot-time activation */
      Store.state.activePatchPayloads[pkg.id] = { js: pkg.payload.js || '', css: pkg.payload.css || '', version: pkg.version };
      /* activation + health check */
      this.activate(pkg.id, pkg.payload);
      const record = {
        id: pkg.id, name: pkg.name, nameFa: pkg.nameFa || pkg.name, version: pkg.version,
        publisher: pkg.publisher || 'unknown',
        installedAt: U.nowISO(), installedBy: Auth.currentUserId(),
        result: 'installed',
        schemaAfter: Store.state.meta.schemaVersion,
        rollbackAvailable: true
      };
      Store.state.meta.installedPatches = (Store.state.meta.installedPatches || []).filter(p => p.id !== pkg.id);
      Store.state.meta.installedPatches.push({ id: pkg.id, version: pkg.version, installedAt: record.installedAt, active: true });
      Store.state.patchHistory.push(record);
      Store.audit('installPatch', 'patch:' + pkg.id, null, pkg.version);
      Store.persist();
      return { ok: true, record };
    } catch (e) {
      Store.state = snapshot;
      Store.state.activePatchPayloads = snapshotActive;
      Store.persist();
      throw new Error(t('patchAutoRollback') + ' — ' + (e.message || e));
    }
  },

  runDataOps(ops) {
    (ops || []).forEach(op => {
      if (op.type === 'ensureCollection') {
        if (!Array.isArray(Store.state[op.collection])) Store.state[op.collection] = [];
      } else if (op.type === 'setting') {
        Store.state.settings[op.key] = op.value;
      }
    });
  },

  activate(patchId, payload) {
    try {
      if (payload.css) {
        let el = document.getElementById('patch-css-' + patchId);
        if (!el) {
          el = document.createElement('style');
          el.id = 'patch-css-' + patchId;
          document.head.appendChild(el);
        }
        el.textContent = payload.css;
      }
      if (payload.js) {
        const fn = new Function('Atlas', '"use strict";\n' + payload.js);
        fn(window.Atlas);
      }
      return { ok: true };
    } catch (e) {
      throw new Error('activation failed: ' + (e.message || e));
    }
  },

  deactivate(patchId) {
    Perms.assert('patch', 'install');
    const rec = (Store.state.meta.installedPatches || []).find(p => p.id === patchId);
    if (rec) rec.active = false;
    if (Store.state.activePatchPayloads[patchId]) Store.state.activePatchPayloads[patchId].active = false;
    const el = document.getElementById('patch-css-' + patchId);
    if (el) el.remove();
    Store.audit('deactivatePatch', 'patch:' + patchId);
    Store.persist();
    UI.toast(t('savedOk'), 'success');
    UI.render();
  },

  reactivate(patchId) {
    Perms.assert('patch', 'install');
    const stored = Store.state.activePatchPayloads[patchId];
    const rec = (Store.state.meta.installedPatches || []).find(p => p.id === patchId);
    if (rec) rec.active = true;
    if (stored) { stored.active = true; this.activate(patchId, stored); }
    Store.persist();
    UI.toast(t('savedOk'), 'success');
    UI.render();
  },

  rollback(patchId) {
    Perms.assert('patch', 'install');
    const rec = Store.state.patchHistory.filter(p => p.id === patchId).pop();
    if (!rec || !rec.rollbackAvailable) throw new Error(t('patchNoRollback'));
    const el = document.getElementById('patch-css-' + patchId);
    if (el) el.remove();
    Store.state.meta.installedPatches = (Store.state.meta.installedPatches || []).filter(p => p.id !== patchId);
    delete Store.state.activePatchPayloads[patchId];
    rec.result = 'rolledBack';
    rec.rolledBackAt = U.nowISO();
    rec.rollbackAvailable = false;
    Store.audit('rollbackPatch', 'patch:' + patchId, null, null);
    Store.persist();
    UI.render();
  }
};

/* ===== 60-save.js ===== */
/* ===== Embedded save system ===== */
const SaveSys = {
  fileHandle: null,
  autosaveTimer: null,
  templateHTML: null,

  captureTemplate() {
    this.templateHTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  },

  buildHTML() {
    let html = this.templateHTML;
    const data = JSON.stringify(Store.state).replace(/<\//g, '<\\/');
    html = this.replaceScript(html, 'atlas-embedded-data', data);
    const patchPayloads = JSON.stringify(Store.state.activePatchPayloads || {}).replace(/<\//g, '<\\/');
    html = this.replaceScript(html, 'atlas-embedded-patch', patchPayloads);
    return html;
  },

  replaceScript(html, id, content) {
    const re = new RegExp('(<script id="' + id + '" type="application\\/json">)([\\s\\S]*?)(<\\/script>)');
    if (!re.test(html)) throw new Error('embedded script ' + id + ' not found');
    return html.replace(re, (m, a, b, c) => a + content + c);
  },

  async save(options) {
    options = options || {};
    try {
      const html = this.buildHTML();
      let ok = false, method = null;
      if (this.fileHandle) {
        try {
          const perm = await this.fileHandle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted' || (await this.fileHandle.requestPermission({ mode: 'readwrite' })) === 'granted') {
            const w = await this.fileHandle.createWritable();
            await w.write(html);
            await w.close();
            ok = true; method = 'fs';
          } else {
            UI.toast(t('savePermissionDenied'), 'warn');
          }
        } catch (e) {
          console.warn('fs save failed', e);
        }
      }
      if (!ok && !options.preventDownload) {
        U.download('Atlas.html', html, 'text/html;charset=utf-8');
        ok = true; method = 'download';
      }
      if (ok) {
        Store.dirty = false;
        Store.lastSavedAt = U.nowISO();
        try { localStorage.setItem('atlas-lastsave', Store.lastSavedAt); } catch (e) {}
        try { localStorage.setItem(LS_KEY, JSON.stringify(Store.state)); } catch (e) {}
        Store.state.meta.lastPortableSave = Store.lastSavedAt;
        UI.updateSaveIndicator();
        if (!options.silent) UI.toast(t('saveSuccess') + ' (' + (method === 'fs' ? t('saveWithFs') : t('saveWithDownload')) + ')', 'success');
      }
      return ok;
    } catch (e) {
      console.error(e);
      UI.toast(t('saveFailed', { msg: e.message || e }), 'error');
      return false;
    }
  },

  scheduleAutosave() {
    if (this.autosaveTimer) clearTimeout(this.autosaveTimer);
    const interval = U.clamp(U.num(Store.state.settings.autosaveInterval, 60), 15, 3600) * 1000;
    this.autosaveTimer = setTimeout(() => {
      Store.persist();
      UI.updateSaveIndicator();
    }, interval);
  },

  pickFile() {
    if (!window.showSaveFilePicker) return false;
    const self = this;
    window.showSaveFilePicker({
      suggestedName: 'Atlas.html',
      types: [{ description: 'Atlas application', accept: { 'text/html': ['.html'] } }]
    }).then(h => { self.fileHandle = h; self.save(); })
      .catch(e => { if (e && e.name !== 'AbortError') UI.toast(t('savePermissionDenied'), 'warn'); });
    return true;
  },

  hasFsAccess() { return !!window.showSaveFilePicker; }
};

/* ===== 65-charts.js ===== */
/* ===== SVG charts (no external libraries) ===== */
const Charts = {
  donut(items, size) {
    size = size || 150;
    const total = items.reduce((a, x) => a + x.value, 0);
    if (!total) return '<div class="empty-state small">' + t('noData') + '</div>';
    const r = size / 2 - 12, cx = size / 2, cy = size / 2, sw = 22;
    let angle = -90, paths = '';
    items.forEach(x => {
      if (!x.value) return;
      const frac = x.value / total;
      const end = angle + frac * 360;
      const large = frac > .5 ? 1 : 0;
      const a0 = angle * Math.PI / 180, a1 = end * Math.PI / 180;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      paths += '<path d="M ' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + '" fill="none" stroke="' + x.color + '" stroke-width="' + sw + '"><title>' + U.esc(x.label) + ': ' + x.value + '</title></path>';
      angle = end;
    });
    let legend = '<div class="chart-legend">';
    items.forEach(x => {
      legend += '<div class="legend-item"><span class="legend-dot" style="background:' + x.color + '"></span>' + U.esc(x.label) + ' <b class="seq-num">' + x.value + '</b></div>';
    });
    legend += '</div>';
    return '<div class="chart-wrap"><svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img">' + paths +
      '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" class="chart-center">' + total + '</text></svg>' + legend + '</div>';
  },

  bars(items, opts) {
    opts = opts || {};
    const max = Math.max(1, ...items.map(x => x.value));
    const H = opts.height || 160, bw = opts.barWidth || 34;
    const w = Math.max(items.length * (bw + 18) + 20, 160);
    let bars = '';
    items.forEach((x, i) => {
      const h = Math.round((x.value / max) * (H - 40));
      const bx = 14 + i * (bw + 18);
      bars += '<g><rect x="' + bx + '" y="' + (H - 24 - h) + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + (x.color || 'var(--accent)') + '"><title>' + U.esc(x.label) + ': ' + x.value + '</title></rect>' +
        '<text x="' + (bx + bw / 2) + '" y="' + (H - 28 - h) + '" text-anchor="middle" class="chart-val">' + x.value + '</text>' +
        '<text x="' + (bx + bw / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="chart-label">' + U.esc(U.truncate(x.label, 10)) + '</text></g>';
    });
    return '<div class="chart-wrap" style="overflow-x:auto"><svg viewBox="0 0 ' + w + ' ' + H + '" width="' + w + '" height="' + H + '" role="img">' + bars + '</svg></div>';
  },

  line(points, opts) {
    opts = opts || {};
    const W = opts.width || 480, H = opts.height || 150, pad = 28;
    if (!points.length) return '<div class="empty-state small">' + t('noData') + '</div>';
    const max = Math.max(1, ...points.map(p => p.value));
    const step = points.length > 1 ? (W - pad * 2) / (points.length - 1) : 0;
    let path = '', dots = '', labels = '';
    points.forEach((p, i) => {
      const x = pad + i * step;
      const y = H - 24 - (p.value / max) * (H - 44);
      path += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="var(--accent)"><title>' + U.esc(p.label) + ': ' + p.value + '</title></circle>';
      if (points.length <= 14 || i % Math.ceil(points.length / 12) === 0) {
        labels += '<text x="' + x.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="chart-label">' + U.esc(U.truncate(p.label, 8)) + '</text>';
      }
    });
    return '<div class="chart-wrap" style="overflow-x:auto"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img">' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2"/>' + dots + labels + '</svg></div>';
  }
};

/* ===== 70-ui.js ===== */
/* ===== UI core: router, layout, components ===== */
const UI = {
  route: { view: 'dashboard', params: {} },
  views: {},
  navItems: [],

  registerView(view) {
    this.views[view.id] = view;
  },

  nav(viewId, params) {
    this.route = { view: viewId, params: params || {} };
    this.render();
    window.scrollTo(0, 0);
  },

  fmtDate(iso, opts) { return Cal.formatISO(iso, I18N.getLang(), opts); },
  fmtTS(ts, withTime) { return Cal.formatTimestamp(ts, I18N.getLang(), withTime); },

  toast(msg, kind) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 350); }, 3800);
  },

  modal(opts) {
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal ' + (opts.large ? 'modal-lg' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + U.esc(opts.title) + '</h3>' +
      '<button class="btn btn-ghost btn-icon" data-close aria-label="' + t('close') + '">✕</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.foot !== null ? '<div class="modal-foot">' + (opts.foot || '') + '</div>' : '') + '</div>';
    root.appendChild(overlay);
    const close = () => { overlay.remove(); if (opts.onClose) opts.onClose(); };
    overlay.addEventListener('click', e => { if (e.target === overlay || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
    });
    if (opts.onMount) opts.onMount(overlay, close);
    const firstInput = overlay.querySelector('input,select,textarea,button.btn-primary');
    if (firstInput) firstInput.focus();
    return { el: overlay, close };
  },

  confirm(msg, onYes, danger) {
    this.modal({
      title: t('confirm'),
      body: '<p>' + U.esc(msg) + '</p>',
      foot: '<button class="btn" data-close>' + t('cancel') + '</button>' +
        '<button class="btn ' + (danger !== false ? 'btn-danger' : 'btn-primary') + '" id="cf-yes">' + t('ok') + '</button>',
      onMount(el, close) {
        el.querySelector('#cf-yes').addEventListener('click', () => { close(); onYes(); });
      }
    });
  },

  formModal(opts) {
    return this.modal({
      title: opts.title,
      body: '<form id="fm-form" novalidate>' + opts.body + '</form>',
      foot: '<button class="btn" data-close>' + t('cancel') + '</button>' +
        '<button class="btn btn-primary" id="fm-submit">' + t('save') + '</button>',
      large: opts.large,
      onMount(el, close) {
        el.querySelector('#fm-submit').addEventListener('click', () => {
          const form = el.querySelector('#fm-form');
          if (opts.onSubmit(form, close) === false) return;
        });
        const form = el.querySelector('#fm-form');
        form.addEventListener('submit', e => { e.preventDefault(); el.querySelector('#fm-submit').click(); });
        if (opts.onMount) opts.onMount(el, close);
      }
    });
  },

  fv(form, name) {
    const el = form.querySelector('[name="' + name + '"]');
    if (!el) return undefined;
    if (el.type === 'checkbox') return el.checked;
    return el.value;
  },
  fvs(form, name) {
    return Array.from(form.querySelectorAll('[name="' + name + '"]:checked')).map(x => x.value);
  },
  fieldError(form, name, msg) {
    const el = form.querySelector('[name="' + name + '"]');
    if (!el) return;
    const field = el.closest('.field');
    if (!field) return;
    let box = field.querySelector('.field-error');
    if (!box) {
      box = document.createElement('div');
      box.className = 'field-error';
      field.appendChild(box);
    }
    box.textContent = msg;
  },

  updateSaveIndicator() {
    const el = document.getElementById('save-indicator');
    if (!el) return;
    const cls = Store.dirty ? 'dirty' : (SaveSys.lastSavedAt || Store.state.meta.lastPortableSave ? '' : '');
    el.className = 'save-indicator ' + cls;
    const when = Store.lastSavedAt || Store.state.meta.lastPortableSave;
    el.innerHTML = '<span class="dot"></span><span class="label">' +
      (Store.dirty ? t('dirtyWarning') : (when ? t('lastSaved') + ': ' + this.fmtTS(when) : t('neverSaved'))) + '</span>';
  },

  guard(viewId, op) {
    const v = this.views[viewId];
    if (!v || v.module === null) return null;
    const mod = v.module || viewId;
    if (!Perms.can(mod, op || 'view')) {
      return '<div class="empty-state"><div class="icon">🔒</div><p>' + t('permDeniedView') + '</p></div>';
    }
    return null;
  },

  /* ---------- layout ---------- */
  render() {
    const app = document.getElementById('app');
    const user = Auth.currentUser();
    if (!user) { app.innerHTML = this.renderAuth(); this.bindAuth(); return; }
    I18N.setLang(Store.state.settings.language);
    document.documentElement.dataset.theme = Store.state.settings.theme;
    const view = this.views[this.route.view] || this.views.dashboard;
    const guardBlock = this.guard(view.id, 'view');
    const navs = this.buildNav();
    app.innerHTML =
      '<div class="layout">' +
      '<aside class="sidebar" id="sidebar">' +
      '<div class="brand"><span class="logo">A</span><span>' + U.esc(t('appName')) + '</span></div>' +
      '<nav class="nav" aria-label="main">' + navs + '</nav>' +
      '</aside>' +
      '<div class="main">' +
      '<header class="topbar">' +
      '<button class="hamburger" id="btn-menu" aria-label="menu">☰</button>' +
      '<div class="page-title">' + U.esc(view.title()) + '</div>' +
      '<form id="topbar-search" class="topbar-search hide-sm" role="search"><input type="search" id="topbar-q" placeholder="' + U.esc(t('globalSearch')) + '" aria-label="' + U.esc(t('globalSearch')) + '"></form>' +
      '<div class="save-indicator" id="save-indicator"></div>' +
      '<button class="btn btn-sm" id="btn-save-app" title="' + t('saveApp') + '">💾 <span class="hide-sm">' + t('saveApp') + '</span></button>' +
      '<button class="btn btn-ghost btn-icon" id="btn-notifications" title="' + t('notifications') + '">🔔' +
      (Notifications.unreadCount() ? '<span class="pill p-danger">' + Notifications.unreadCount() + '</span>' : '') + '</button>' +
      '<div class="user-cell"><span class="avatar">' + U.esc(this.initials(Users.displayName(user))) + '</span>' +
      '<div class="meta hide-sm"><div>' + U.esc(Users.displayName(user)) + '</div><div class="sub">' + U.esc(this.roleNames(user)) + '</div></div></div>' +
      '<button class="btn btn-ghost btn-icon" id="btn-logout" title="' + t('logout') + '">⏻</button>' +
      '</header>' +
      '<main class="content ' + (view.fluid ? 'content-fluid' : '') + '" id="content">' +
      (guardBlock || view.render(this.route.params)) +
      '</main>' +
      '</div>' +
      '</div>' +
      this.mobileTabbar();
    this.bindLayout();
    if (!guardBlock && view.bind) view.bind(this.route.params);
    this.updateSaveIndicator();
    document.getElementById('btn-save-app').addEventListener('click', () => SaveSys.save());
  },

  initials(name) {
    const parts = String(name || '?').trim().split(/\s+/);
    return (parts[0] || '?').charAt(0) + (parts[1] ? parts[1].charAt(0) : '');
  },
  roleNames(user) {
    return (user.roles || []).slice(0, 2).map(r => Roles.roleLabelById(r)).join('، ');
  },

  buildNav() {
    const items = [];
    const add = (viewId, icon, section) => {
      const v = this.views[viewId];
      if (!v) return;
      if (v.module && !Perms.can(v.module, 'view')) return;
      items.push('<a href="#' + viewId + '" data-nav="' + viewId + '" class="' + (this.route.view === viewId ? 'active' : '') + '">' +
        '<span class="nav-icon">' + icon + '</span><span>' + U.esc(v.title()) + '</span>' +
        (viewId === 'notifications' && Notifications.unreadCount() ? '<span class="badge">' + Notifications.unreadCount() + '</span>' : '') +
        '</a>');
    };
    let html = '<div class="nav-section">' + t('nav_main') + '</div>';
    const main = ['dashboard', 'myTasks', 'projects', 'tasks', 'calendar', 'reports'];
    main.forEach(id => { if (this.views[id]) add(id, this.iconFor(id), 'main'); });
    html += items.join('');
    items.length = 0;
    html += '<div class="nav-section">' + t('nav_org') + '</div>';
    ['employees', 'org', 'announcements'].forEach(id => { if (this.views[id]) add(id, this.iconFor(id), 'org'); });
    html += items.join('');
    items.length = 0;
    html += '<div class="nav-section">' + t('nav_admin') + '</div>';
    ['users', 'roles', 'workflow', 'customfields', 'auditLog'].forEach(id => { if (this.views[id]) add(id, this.iconFor(id), 'admin'); });
    html += items.join('');
    items.length = 0;
    html += '<div class="nav-section">' + t('nav_data') + '</div>';
    ['backup', 'patchCenter', 'settings'].forEach(id => { if (this.views[id]) add(id, this.iconFor(id), 'data'); });
    html += items.join('');
    return html;
  },

  iconFor(id) {
    return ({
      dashboard: '📊', myTasks: '📋', projects: '📁', tasks: '✅', calendar: '📅', reports: '📈',
      employees: '👥', org: '🏢', announcements: '📣', users: '🔑', roles: '🛡️', workflow: '🔀',
      customfields: '🧩', auditLog: '📜', backup: '💾', patchCenter: '⬆️', settings: '⚙️', notifications: '🔔'
    })[id] || '•';
  },

  mobileTabbar() {
    const ids = ['dashboard', 'tasks', 'projects', 'calendar', 'settings'];
    let html = '<nav class="mobile-tabbar">';
    ids.forEach(id => {
      const v = this.views[id];
      if (!v) return;
      if (v.module && !Perms.can(v.module, 'view')) return;
      html += '<a href="#' + id + '" data-nav="' + id + '" class="' + (this.route.view === id ? 'active' : '') + '">' +
        '<span class="nav-icon">' + this.iconFor(id) + '</span><span>' + U.esc(v.title()) + '</span></a>';
    });
    return html + '</nav>';
  },

  bindLayout() {
    const sidebar = document.getElementById('sidebar');
    const btn = document.getElementById('btn-menu');
    if (btn) btn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
    document.querySelectorAll('[data-nav]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        sidebar.classList.remove('open');
        this.nav(a.dataset.nav);
      });
    });
    document.getElementById('btn-logout').addEventListener('click', () => {
      Auth.logout();
      this.render();
    });
    const searchForm = document.getElementById('topbar-search');
    searchForm.addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('topbar-q').value.trim();
      if (q) this.nav('search', { q });
    });
    document.getElementById('btn-notifications').addEventListener('click', () => {
      this.nav('notifications');
    });
  },

  /* ---------- auth screens ---------- */
  renderAuth() {
    I18N.setLang(Store.state.settings.language);
    document.documentElement.dataset.theme = Store.state.settings.theme;
    if (Store.state.users.length === 0) {
      return this.renderFirstRun();
    }
    return '<div class="login-wrap"><div class="login-box"><div class="card">' +
      '<div class="flex mb-2"><span class="logo" style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-weight:700">A</span>' +
      '<div><h2 class="mb-0" style="margin:0">' + U.esc(t('appName')) + '</h2><div class="muted small">' + U.esc(t('appTitle')) + '</div></div></div>' +
      '<form id="login-form" novalidate>' +
      '<div class="field"><label for="lg-user">' + t('username') + '</label><input id="lg-user" name="username" type="text" autocomplete="username" required></div>' +
      '<div class="field"><label for="lg-pass">' + t('password') + '</label><input id="lg-pass" name="password" type="password" autocomplete="current-password" required></div>' +
      '<div class="field-error" id="lg-error"></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">' + t('loginBtn') + '</button>' +
      '</form><p class="muted small mt-2">' + U.esc(t('loginHint')) + '</p>' +
      '<div class="flex-between"><button class="btn btn-ghost btn-sm" id="lg-lang">' + (I18N.getLang() === 'fa' ? 'English' : 'فارسی') + '</button>' +
      '<span class="muted small">v' + APP_VERSION + '</span></div>' +
      '</div></div></div>';
  },

  renderFirstRun() {
    return '<div class="login-wrap"><div class="login-box"><div class="card">' +
      '<h2>' + t('firstRunTitle') + '</h2><p class="muted">' + t('firstRunDesc') + '</p>' +
      '<form id="setup-form" novalidate>' +
      '<div class="field"><label>' + t('adminUsername') + '</label><input name="username" type="text" required pattern="[a-zA-Z0-9.]{3,32}"><div class="hint">' + t('usernameRules') + '</div></div>' +
      '<div class="field"><label>' + t('fullName') + '</label><input name="displayName" type="text" required></div>' +
      '<div class="field"><label>' + t('initialPassword') + '</label><input name="password" type="password" required minlength="6"></div>' +
      '<div class="field"><label>' + t('confirmPassword') + '</label><input name="password2" type="password" required></div>' +
      '<div class="field-error" id="su-error"></div>' +
      '<button class="btn btn-primary" type="submit" style="width:100%">' + t('setupBtn') + '</button>' +
      '</form>' +
      '<div class="mt-2 flex-between"><button class="btn btn-ghost btn-sm" id="su-lang">' + (I18N.getLang() === 'fa' ? 'English' : 'فارسی') + '</button>' +
      '<button class="btn btn-ghost btn-sm" id="su-demo">' + t('demoData') + '</button></div>' +
      '</div></div></div>';
  },

  bindAuth() {
    const langBtn = document.getElementById('lg-lang') || document.getElementById('su-lang');
    if (langBtn) langBtn.addEventListener('click', () => {
      Store.state.settings.language = I18N.getLang() === 'fa' ? 'en' : 'fa';
      Store.persist();
      this.render();
    });
    const demoBtn = document.getElementById('su-demo');
    if (demoBtn) demoBtn.addEventListener('click', () => {
      Seed.create({ withAdmin: true });
      Store.persist();
      this.toast(t('savedOk'), 'success');
      this.render();
    });
    const loginForm = document.getElementById('login-form');
    if (loginForm) loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const res = Auth.login(this.fv(loginForm, 'username'), this.fv(loginForm, 'password'));
      if (!res.ok) {
        document.getElementById('lg-error').textContent = t(res.error);
        return;
      }
      this.nav('dashboard');
    });
    const setupForm = document.getElementById('setup-form');
    if (setupForm) setupForm.addEventListener('submit', e => {
      e.preventDefault();
      const err = document.getElementById('su-error');
      const pw = this.fv(setupForm, 'password'), pw2 = this.fv(setupForm, 'password2');
      if (pw !== pw2) { err.textContent = t('passwordMismatch'); return; }
      try {
        const adminRole = Store.state.roles.find(r => r.key === 'role_admin') || Store.state.roles[0];
        Users.create({ username: this.fv(setupForm, 'username'), displayName: this.fv(setupForm, 'displayName'), password: pw, roles: [adminRole.id] });
        Store.persist();
        this.toast(t('savedOk'), 'success');
        this.render();
      } catch (ex) { err.textContent = ex.message; }
    });
  }
};

/* ===== 72-widgets.js ===== */
/* ===== Shared widgets: datepicker, selects, pills, pagination ===== */
const Widgets = {
  datepicker(inputId, opts) {
    opts = opts || {};
    const input = document.getElementById(inputId);
    if (!input) return;
    const lang = I18N.getLang();
    const sys = Cal.systemFor(lang);
    input.readOnly = true;
    input.style.cursor = 'pointer';
    input.setAttribute('data-iso', opts.value || '');
    const show = () => {
      const currentISO = input.getAttribute('data-iso') || Cal.todayISO();
      const p = Cal.isoToParts(currentISO, sys) || Cal.isoToParts(Cal.todayISO(), sys);
      let y = p.y, m = p.m;
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.style.alignItems = 'center';
      const draw = () => {
        const len = Cal.monthLen(y, m, sys);
        const grid = Cal.monthGridStart(y, m, sys, Store.state.settings.weekStart);
        const startISO = Cal.addDays(grid.firstISO, -grid.startIdx);
        let cells = '';
        for (let i = 0; i < 42; i++) {
          const iso = Cal.addDays(startISO, i);
          const pp = Cal.isoToParts(iso, sys);
          const inMonth = pp.m === m && pp.y === y;
          const isToday = iso === Cal.todayISO();
          const isSel = iso === input.getAttribute('data-iso');
          cells += '<button type="button" class="dp-day' + (inMonth ? '' : ' dp-out') + (isToday ? ' dp-today' : '') + (isSel ? ' dp-sel' : '') + '" data-iso="' + iso + '" style="' +
            (isSel ? 'background:var(--accent);color:#fff;' : '') + '">' + pp.d + '</button>';
        }
        const months = sys === 'jalali' ? Cal.FA_MONTHS : Cal.EN_MONTHS;
        const monthOpts = months.map((mn, i) => '<option value="' + (i + 1) + '"' + (i + 1 === m ? ' selected' : '') + '>' + mn + '</option>').join('');
        overlay.innerHTML = '<div class="modal" style="max-width:320px"><div class="modal-body">' +
          '<div class="flex-between mb-1">' +
          '<button type="button" class="btn btn-sm btn-icon" data-nav="-1">‹</button>' +
          '<select id="dp-month" style="width:auto">' + monthOpts + '</select>' +
          '<input id="dp-year" type="number" value="' + y + '" style="width:90px" min="' + (sys === 'jalali' ? 1300 : 1900) + '" max="' + (sys === 'jalali' ? 1600 : 2200) + '">' +
          '<button type="button" class="btn btn-sm btn-icon" data-nav="1">›</button></div>' +
          '<div class="dp-grid">' + (sys === 'jalali' ? Cal.FA_WEEKDAYS_SHORT : Cal.EN_WEEKDAYS_SHORT).map(d => '<div class="dp-wd">' + d + '</div>').join('') + cells + '</div>' +
          '<div class="btn-row mt-1"><button type="button" class="btn btn-sm" id="dp-today">' + t('today') + '</button>' +
          '<button type="button" class="btn btn-sm" id="dp-clear">' + t('clear') + '</button></div>' +
          '</div></div>';
        overlay.querySelector('[data-nav="-1"]').addEventListener('click', () => { const nm = Cal.addMonths(y, m, -1, sys); y = nm.y; m = nm.m; draw(); });
        overlay.querySelector('[data-nav="1"]').addEventListener('click', () => { const nm = Cal.addMonths(y, m, 1, sys); y = nm.y; m = nm.m; draw(); });
        overlay.querySelector('#dp-month').addEventListener('change', e => { m = +e.target.value; draw(); });
        overlay.querySelector('#dp-year').addEventListener('change', e => { y = U.clamp(+e.target.value || y, sys === 'jalali' ? 1300 : 1900, sys === 'jalali' ? 1600 : 2200); draw(); });
        overlay.querySelectorAll('.dp-day').forEach(b => b.addEventListener('click', () => {
          input.setAttribute('data-iso', b.dataset.iso);
          input.value = Cal.formatISO(b.dataset.iso, lang);
          overlay.remove();
          if (opts.onChange) opts.onChange(b.dataset.iso);
        }));
        overlay.querySelector('#dp-today').addEventListener('click', () => {
          input.setAttribute('data-iso', Cal.todayISO());
          input.value = Cal.formatISO(Cal.todayISO(), lang);
          overlay.remove();
          if (opts.onChange) opts.onChange(Cal.todayISO());
        });
        overlay.querySelector('#dp-clear').addEventListener('click', () => {
          input.setAttribute('data-iso', '');
          input.value = '';
          overlay.remove();
          if (opts.onChange) opts.onChange('');
        });
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      };
      draw();
      document.getElementById('modal-root').appendChild(overlay);
    };
    input.value = opts.value ? Cal.formatISO(opts.value, lang) : '';
    input.addEventListener('click', show);
    input.addEventListener('focus', show);
  },

  getISO(form, name) {
    const el = form.querySelector('[name="' + name + '"]');
    return el ? (el.getAttribute('data-iso') || '') : '';
  },

  dateField(name, label, value, required) {
    return '<div class="field"><label>' + U.esc(label) + (required ? ' *' : '') + '</label>' +
      '<input type="text" name="' + name + '" id="df-' + name + '" data-iso="' + (value || '') + '" readonly></div>';
  },

  selectField(name, label, options, value, opts) {
    opts = opts || {};
    const optHtml = (opts.empty ? '<option value="">' + U.esc(opts.empty) + '</option>' : '') +
      options.map(o => '<option value="' + U.esc(o.value) + '"' + (String(o.value) === String(value) ? ' selected' : '') + '>' + U.esc(o.label) + '</option>').join('');
    return '<div class="field' + (opts.span2 ? ' span-2' : '') + '"><label>' + U.esc(label) + '</label>' +
      '<select name="' + name + '"' + (opts.multiple ? ' multiple size="5"' : '') + '>' + optHtml + '</select></div>';
  },

  employeeOptions(filterFn) {
    return Employees.active().filter(filterFn || (() => true)).map(e => ({ value: e.id, label: e.fullName + ' (' + e.empNo + ')' }));
  },
  projectOptions() {
    return Projects.visible().map(p => ({ value: p.id, label: p.title }));
  },
  deptOptions() {
    return Store.state.departments.map(d => ({ value: d.id, label: d.name }));
  },
  teamOptions() {
    return Store.state.teams.map(x => ({ value: x.id, label: x.name }));
  },
  statusOptions(kind) {
    return Workflow.statuses(kind).map(s => ({ value: s.id, label: Workflow.statusLabel(kind, s.id) }));
  },
  priorityOptions() {
    return Priorities.list().map(p => ({ value: p.id, label: Priorities.label(p.id) }));
  },

  statusPill(kind, statusId) {
    const s = Workflow.status(kind, statusId);
    if (!s) return '<span class="pill">' + U.esc(statusId) + '</span>';
    const kindCls = { done: 'p-ok', cancelled: 'p-muted', active: 'p-info', open: 'p-muted' }[s.kind] || '';
    return '<span class="pill ' + kindCls + '">' + U.esc(Workflow.statusLabel(kind, statusId)) + '</span>';
  },
  priorityPill(id) {
    const p = Priorities.list().find(x => x.id === id) || {};
    const cls = { critical: 'p-danger', high: 'p-warn', medium: 'p-info', low: 'p-muted' }[id] || 'p-muted';
    return '<span class="pill ' + cls + '">' + U.esc(Priorities.label(id)) + '</span>';
  },
  progressCell(p) {
    const v = U.clamp(U.num(p), 0, 100);
    const cls = v >= 100 ? 'ok' : v >= 50 ? '' : 'warn';
    return '<div class="flex" style="min-width:90px"><div class="progress ' + cls + ' grow"><div style="width:' + v + '%"></div></div><span class="small seq-num">' + v + '%</span></div>';
  },
  userCell(name, sub) {
    return '<div class="user-cell"><span class="avatar">' + U.esc(UI.initials(name)) + '</span><div class="meta"><div>' + U.esc(name) + '</div>' +
      (sub ? '<div class="sub">' + U.esc(sub) + '</div>' : '') + '</div></div>';
  },
  pagination(total, page, perPage, onPage) {
    const pages = Math.max(1, Math.ceil(total / perPage));
    if (pages <= 1) return '';
    let html = '<div class="flex gap mt-1" style="justify-content:center">';
    for (let i = 1; i <= pages; i++) {
      if (pages > 9 && i > 2 && i < pages - 1 && Math.abs(i - page) > 1) {
        if (i === 3 && page > 4 || i === pages - 2 && page < pages - 3) html += '<span class="muted">…</span>';
        continue;
      }
      html += '<button class="btn btn-sm ' + (i === page ? 'btn-primary' : '') + '" data-page="' + i + '">' + i + '</button>';
    }
    html += '</div>';
    setTimeout(() => {
      document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => onPage(+b.dataset.page)));
    }, 0);
    return html;
  },
  tagsInput(name, value) {
    return '<input type="text" name="' + name + '" value="' + U.esc((value || []).join(', ')) + '" placeholder="' + t('tags') + '">';
  },
  parseTags(v) {
    return String(v || '').split(/[,،]/).map(x => x.trim()).filter(Boolean);
  }
};

/* ===== 80-view-dashboard.js ===== */
/* ===== View: Dashboard ===== */
UI.registerView({
  id: 'dashboard',
  module: 'dashboard',
  title: () => t('dashboard'),
  render() {
    const s = Store.state;
    const lang = I18N.getLang();
    const projects = Projects.visible();
    const tasks = Perms.visible('tasks', s.tasks.filter(x => !x.archived && !x.parentId));
    const today = Cal.todayISO();
    const kindOf = k => Workflow.kindOf('project', k);
    const stats = {
      totalProjects: projects.length,
      activeProjects: projects.filter(p => kindOf(p.status) === 'active' || kindOf(p.status) === 'open').length,
      completedProjects: projects.filter(p => kindOf(p.status) === 'done').length,
      delayedProjects: projects.filter(p => Projects.isDelayed(p)).length,
      totalTasks: tasks.length,
      completedTasks: tasks.filter(x => Workflow.kindOf('task', x.status) === 'done').length,
      inProgressTasks: tasks.filter(x => Workflow.kindOf('task', x.status) === 'active').length,
      overdueTasks: tasks.filter(x => Tasks.isOverdue(x)).length
    };
    const widgets = s.settings.dashboardWidgets || {};
    let html = '<div class="flex-between mb-2"><h1 class="mb-0">' + U.esc(t('dash_welcomeUser', { name: Users.displayName(Auth.currentUser()) })) + '</h1>' +
      (Perms.can('settings', 'edit') ? '<button class="btn btn-sm" id="btn-dash-cfg">⚙ ' + t('dash_customize') + '</button>' : '') + '</div>';

    if (widgets.stats) {
      html += '<div class="grid grid-4 mb-2">' +
        this.stat(t('dash_totalProjects'), stats.totalProjects, '') +
        this.stat(t('dash_activeProjects'), stats.activeProjects, '') +
        this.stat(t('dash_completedProjects'), stats.completedProjects, 'ok') +
        this.stat(t('dash_delayedProjects'), stats.delayedProjects, 'danger') +
        this.stat(t('dash_totalTasks'), stats.totalTasks, '') +
        this.stat(t('dash_completedTasks'), stats.completedTasks, 'ok') +
        this.stat(t('dash_inProgressTasks'), stats.inProgressTasks, '') +
        this.stat(t('dash_overdueTasks'), stats.overdueTasks, 'danger') +
        '</div>';
    }
    html += '<div class="grid grid-2">';
    if (widgets.charts) {
      html += '<div class="card"><h3>' + t('dash_projectStatus') + '</h3>' +
        Charts.donut(Workflow.statuses('project').map(st => ({
          label: Workflow.statusLabel('project', st.id), value: projects.filter(p => p.status === st.id).length, color: st.color
        }))) + '</div>';
      html += '<div class="card"><h3>' + t('dash_taskStatus') + '</h3>' +
        Charts.donut(Workflow.statuses('task').map(st => ({
          label: Workflow.statusLabel('task', st.id), value: tasks.filter(x => x.status === st.id).length, color: st.color
        }))) + '</div>';
    }
    if (widgets.deadlines) {
      const upcoming = tasks.filter(x => x.dueDate && Workflow.kindOf('task', x.status) === 'active' && Cal.diffDays(x.dueDate, today) >= 0 && Cal.diffDays(x.dueDate, today) <= 14)
        .sort((a, b) => U.cmp(a.dueDate, b.dueDate)).slice(0, 8);
      html += '<div class="card"><h3>' + t('dash_upcomingDeadlines') + '</h3>' +
        (upcoming.length ? '<ul class="timeline">' + upcoming.map(x => '<li><div class="tl-head"><a href="#" data-task="' + x.id + '">' + U.esc(x.title) + '</a>' +
          '<span class="pill ' + (Cal.diffDays(x.dueDate, today) <= 2 ? 'p-danger' : 'p-warn') + '">' + this.fmt(x.dueDate) + '</span></div></li>').join('') + '</ul>'
          : '<div class="empty-state small">' + t('noData') + '</div>') + '</div>';
    }
    if (widgets.milestones) {
      const ms = [];
      projects.forEach(p => Projects.projectMilestones(p.id).forEach(m => { if (!m.done) ms.push({ p, m }); }));
      ms.sort((a, b) => U.cmp(a.m.dueDate || '9999', b.m.dueDate || '9999'));
      html += '<div class="card"><h3>' + t('dash_upcomingMilestones') + '</h3>' +
        (ms.length ? '<ul class="timeline">' + ms.slice(0, 8).map(r => '<li><div class="tl-head"><a href="#" data-project="' + r.p.id + '">' + U.esc(r.m.title) + '</a>' +
          '<span class="muted small">' + U.esc(r.p.title) + '</span>' +
          (r.m.dueDate ? '<span class="pill p-info">' + this.fmt(r.m.dueDate) + '</span>' : '') + '</div></li>').join('') + '</ul>'
          : '<div class="empty-state small">' + t('noData') + '</div>') + '</div>';
    }
    if (widgets.workload) {
      const emps = Employees.active().filter(e => Perms.can('employees', 'view', e));
      const wl = emps.map(e => ({ label: e.fullName, value: Employees.workload(e.id) })).filter(x => x.value > 0)
        .sort((a, b) => b.value - a.value).slice(0, 8);
      html += '<div class="card"><h3>' + t('dash_employeeWorkload') + '</h3>' +
        (wl.length ? Charts.bars(wl) : '<div class="empty-state small">' + t('noData') + '</div>') + '</div>';
    }
    if (widgets.activity) {
      const acts = Store.state.auditLog.slice(-10).reverse();
      html += '<div class="card"><h3>' + t('dash_recentActivity') + '</h3>' +
        (acts.length ? '<ul class="timeline">' + acts.map(a => '<li><div class="tl-head"><span>' + U.esc(Reports.userName(a.actorId)) + '</span>' +
          '<span class="muted small">' + U.esc(a.action) + '</span><span class="tl-time">' + this.fmtTS(a.at) + '</span></div></li>').join('') + '</ul>'
          : '<div class="empty-state small">' + t('noData') + '</div>') + '</div>';
    }
    html += '</div>';
    html += '<div class="card"><h3>' + t('dash_taskTrend') + '</h3>' + this.trendChart(tasks) + '</div>';
    return html;
  },
  stat(label, value, cls) {
    return '<div class="stat-card ' + cls + '"><div class="stat-value seq-num">' + value + '</div><div class="stat-label">' + U.esc(label) + '</div></div>';
  },
  fmt(iso) { return Cal.formatISO(iso, I18N.getLang()); },
  fmtTS(ts) { return Cal.formatTimestamp(ts, I18N.getLang(), false); },
  trendChart(tasks) {
    const done = tasks.filter(x => x.completedAt);
    const weeks = [];
    const today = Cal.todayISO();
    for (let i = 7; i >= 0; i--) {
      const end = Cal.addDays(today, -i * 7);
      const start = Cal.addDays(end, -6);
      weeks.push({ label: Cal.formatISO(start, I18N.getLang(), { medium: true }), value: done.filter(x => x.completedAt >= start + 'T00:00' && x.completedAt <= end + 'T23:59').length });
    }
    return Charts.line(weeks);
  },
  bind() {
    document.querySelectorAll('[data-task]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); TaskViews.openDetails(a.dataset.task);
    }));
    document.querySelectorAll('[data-project]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); UI.nav('projectDetail', { id: a.dataset.project });
    }));
    const cfg = document.getElementById('btn-dash-cfg');
    if (cfg) cfg.addEventListener('click', () => this.configure());
  },
  configure() {
    const w = Store.state.settings.dashboardWidgets;
    const defs = [['stats', 'stats'], ['charts', 'charts'], ['deadlines', 'dash_upcomingDeadlines'], ['milestones', 'dash_upcomingMilestones'], ['workload', 'dash_employeeWorkload'], ['activity', 'dash_recentActivity']];
    UI.formModal({
      title: t('dash_customize'),
      body: defs.map(([id, key]) => '<div class="field checkbox-row"><input type="checkbox" name="' + id + '" id="w-' + id + '"' + (w[id] ? ' checked' : '') + '><label for="w-' + id + '" style="margin:0">' + U.esc(t(key === 'stats' ? 'stats' : key)) + '</label></div>').join(''),
      onSubmit: (form, close) => {
        defs.forEach(([id]) => { w[id] = UI.fv(form, id); });
        Store.markDirty();
        close();
        UI.render();
      }
    });
  }
});
