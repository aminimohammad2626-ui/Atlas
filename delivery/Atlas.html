/* 10-base.css */
/* ===== Atlas base design system ===== */
:root {
  --font: 'Vazirmatn', 'Tahoma', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 8px 24px rgba(16,24,40,.14);
  --sidebar-w: 232px;
  --header-h: 56px;
  --speed: .18s;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.65;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0 0 .5em; line-height: 1.4; font-weight: 700; }
h1 { font-size: 1.45rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
ul, ol { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ---------- layout ---------- */
#app { min-height: 100vh; }
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--sidebar-bg); color: var(--sidebar-text);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  transition: transform var(--speed);
  z-index: 40;
}
.sidebar .brand {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; font-weight: 700; font-size: 1.15rem;
  border-bottom: 1px solid var(--sidebar-border);
  color: var(--sidebar-heading);
}
.brand .logo {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff; font-size: 15px; font-weight: 700;
}
.nav { padding: 10px 10px 20px; flex: 1; }
.nav .nav-section {
  font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
  color: var(--sidebar-muted); padding: 14px 10px 4px; font-weight: 500;
}
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; margin: 1px 0; border-radius: var(--radius-sm);
  color: var(--sidebar-text); font-size: .92rem;
}
.nav a:hover { background: var(--sidebar-hover); text-decoration: none; }
.nav a.active { background: var(--accent); color: #fff; font-weight: 500; }
.nav .nav-icon { width: 20px; text-align: center; flex-shrink: 0; opacity: .85; }
.nav .badge {
  margin-inline-start: auto; background: var(--danger); color: #fff;
  font-size: .68rem; border-radius: 10px; padding: 0 6px; min-width: 18px; text-align: center;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--header-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 30;
}
.topbar .page-title { font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.content { padding: 20px; max-width: 1280px; width: 100%; }
.content-fluid { max-width: none; }
.hamburger { display: none; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 1.05rem; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }

/* ---------- components ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 16px;
}
.card > h2, .card > h3 { margin-top: 0; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2, .card-head h3 { margin: 0; flex: 1; min-width: 120px; }
.grid { display: grid; gap: 14px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.stat-card .stat-value { font-size: 1.55rem; font-weight: 700; color: var(--accent); line-height: 1.3; }
.stat-card .stat-label { color: var(--muted); font-size: .82rem; }
.stat-card.warn .stat-value { color: var(--warning); }
.stat-card.danger .stat-value { color: var(--danger); }
.stat-card.ok .stat-value { color: var(--success); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); border-radius: var(--radius-sm);
  padding: 7px 14px; cursor: pointer; font-size: .9rem;
  transition: background var(--speed), border-color var(--speed);
  min-height: 34px;
}
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-strong); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-danger:hover { filter: brightness(.92); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn-sm { padding: 4px 10px; min-height: 28px; font-size: .82rem; }
.btn-icon { padding: 6px 9px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

input[type=text], input[type=password], input[type=number], input[type=email], input[type=search],
input[type=date], select, textarea {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  min-height: 36px;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: .84rem; font-weight: 500; margin-bottom: 5px; color: var(--text); }
.field .hint { font-size: .76rem; color: var(--muted); margin-top: 4px; }
.field-error { color: var(--danger); font-size: .78rem; margin-top: 4px; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 16px; }
.form-grid .span-2 { grid-column: span 2; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; margin: 0 0 14px; }
legend { font-size: .84rem; font-weight: 600; padding: 0 6px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; }
.checkbox-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }

table.data-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
.data-table th, .data-table td { padding: 9px 10px; text-align: start; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table th { font-weight: 600; color: var(--muted); font-size: .8rem; background: var(--surface-2); white-space: nowrap; }
.data-table tbody tr:hover { background: var(--hover); }
.data-table .row-actions { white-space: nowrap; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .74rem; font-weight: 500; padding: 2px 10px;
  border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border);
  white-space: nowrap;
}
.pill.p-ok { background: var(--success-soft); color: var(--success); border-color: transparent; }
.pill.p-warn { background: var(--warning-soft); color: var(--warning-strong); border-color: transparent; }
.pill.p-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.pill.p-info { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.pill.p-muted { background: var(--surface-2); color: var(--muted); }
.tag { display: inline-block; font-size: .72rem; background: var(--accent-soft); color: var(--accent-strong); border-radius: 999px; padding: 1px 8px; margin: 1px 2px 1px 0; }

.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; min-width: 60px; }
.progress > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width var(--speed); }
.progress.ok > div { background: var(--success); }
.progress.warn > div { background: var(--warning); }
.progress.danger > div { background: var(--danger); }

.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-soft); color: var(--accent-strong);
  display: inline-grid; place-items: center; font-size: .8rem; font-weight: 600;
}
.avatar.lg { width: 56px; height: 56px; font-size: 1.3rem; }
.user-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
.user-cell .meta { min-width: 0; }
.user-cell .meta .sub { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- modal / toast ---------- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.5);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 4vh 12px; z-index: 100; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: 100%; max-width: 560px;
  border: 1px solid var(--border);
  animation: modalIn .16s ease-out;
}
.modal.modal-lg { max-width: 860px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; flex: 1; font-size: 1rem; }
.modal-body { padding: 18px; max-height: 70vh; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }

#toast-root { position: fixed; bottom: 18px; inset-inline-start: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(92vw, 380px); }
.toast {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-inline-start: 4px solid var(--accent);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 10px 14px; font-size: .88rem;
  animation: toastIn .2s ease-out;
}
.toast.success { border-inline-start-color: var(--success); }
.toast.error { border-inline-start-color: var(--danger); }
.toast.warn { border-inline-start-color: var(--warning); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- misc ---------- */
.empty-state { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty-state .icon { font-size: 2rem; margin-bottom: 8px; }
.muted { color: var(--muted); font-size: .84rem; }
.small { font-size: .8rem; }
.mono { font-family: ui-monospace, monospace; font-size: .82rem; direction: ltr; unicode-bidi: embed; }
.flex { display: flex; gap: 10px; align-items: center; }
.flex-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mt-0 { margin-top: 0; } .mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; }
.mb-0 { margin-bottom: 0; } .mb-1 { margin-bottom: 8px; } .mb-2 { margin-bottom: 16px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.nowrap { white-space: nowrap; }
.text-danger { color: var(--danger); }
.text-ok { color: var(--success); }
.text-warn { color: var(--warning-strong); }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
.filter-bar .field { margin-bottom: 0; min-width: 130px; flex: 1; max-width: 220px; }
.filter-bar .field.wide { max-width: 320px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; }
.timeline li { position: relative; padding: 0 0 14px 0; padding-inline-start: 22px; border-inline-start: 2px solid var(--border); margin-inline-start: 6px; }
.timeline li:last-child { border-color: transparent; }
.timeline li::before {
  content: ''; position: absolute; top: 4px; inset-inline-start: -6px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
}
.timeline .tl-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.timeline .tl-time { font-size: .74rem; color: var(--muted); }
.breadcrumb { font-size: .82rem; color: var(--muted); margin-bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.save-indicator { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.save-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.save-indicator.dirty .dot { background: var(--warning); }
.save-indicator.error .dot { background: var(--danger); }
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.login-box { width: 100%; max-width: 380px; }
.login-box .card { padding: 28px; }
.seq-num { font-variant-numeric: tabular-nums; }

/* topbar search */
.topbar-search input {
  width: 220px; max-width: 32vw; padding: 7px 12px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text); font: inherit; font-size: .85rem;
}
.topbar-search input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* filter rows */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter-row select, .filter-row input { width: auto; min-width: 130px; }

/* scrollable tables */
.table-scroll { overflow-x: auto; }
.table-scroll table { min-width: 560px; }

/* clickable rows */
.row-link { cursor: pointer; }
.row-link:hover { background: var(--surface-2); }

/* unread timeline emphasis */
.timeline li[role="button"] { cursor: pointer; border-radius: 6px; }
.timeline li[role="button"]:hover { background: var(--surface-2); }

/* 20-themes.css */
/* ===== Themes ===== */

/* --- Simple (default): light, minimal --- */
html[data-theme="simple"] {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --hover: #f0f4ff;
  --border: #e3e6ea;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-2: #7c3aed;
  --accent-soft: #dbeafe;
  --success: #15803d;
  --success-soft: #dcfce7;
  --warning: #b45309;
  --warning-strong: #92400e;
  --warning-soft: #fef3c7;
  --danger: #dc2626;
  --danger-soft: #fee2e2;
  --sidebar-bg: #ffffff;
  --sidebar-text: #374151;
  --sidebar-heading: #111827;
  --sidebar-muted: #9ca3af;
  --sidebar-hover: #f0f2f5;
  --sidebar-border: #e3e6ea;
}

/* --- Midnight: dark theme --- */
html[data-theme="midnight"] {
  --bg: #0f1420;
  --surface: #171e2e;
  --surface-2: #1f2740;
  --hover: #232c47;
  --border: #2c3550;
  --text: #e5e9f2;
  --muted: #94a0b8;
  --accent: #6366f1;
  --accent-strong: #818cf8;
  --accent-2: #22d3ee;
  --accent-soft: #26304f;
  --success: #34d399;
  --success-soft: #113527;
  --warning: #fbbf24;
  --warning-strong: #fcd34d;
  --warning-soft: #3a2e10;
  --danger: #f87171;
  --danger-soft: #3b1a1a;
  --sidebar-bg: #131928;
  --sidebar-text: #c3cbdd;
  --sidebar-heading: #eef1f8;
  --sidebar-muted: #6b7690;
  --sidebar-hover: #222b45;
  --sidebar-border: #262f4a;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

/* --- Classic: top-navigation layout, denser, serif headings --- */
html[data-theme="classic"] {
  --bg: #efece5;
  --surface: #fbfaf7;
  --surface-2: #f1eee6;
  --hover: #ece7db;
  --border: #d8d2c4;
  --text: #2b2620;
  --muted: #7a7263;
  --accent: #0f766e;
  --accent-strong: #115e59;
  --accent-2: #b45309;
  --accent-soft: #d7ece9;
  --success: #3f6212;
  --success-soft: #e4ecc9;
  --warning: #a16207;
  --warning-strong: #854d0e;
  --warning-soft: #f5e9c8;
  --danger: #b91c1c;
  --danger-soft: #f6dede;
  --sidebar-bg: #2b2620;
  --sidebar-text: #e8e2d5;
  --sidebar-heading: #fbfaf7;
  --sidebar-muted: #a89e8b;
  --sidebar-hover: #3a342b;
  --sidebar-border: #443d33;
  --radius: 4px;
  --radius-sm: 3px;
}
html[data-theme="classic"] body { font-size: 13.5px; }
html[data-theme="classic"] h1, html[data-theme="classic"] h2, html[data-theme="classic"] h3 { letter-spacing: .01em; }
html[data-theme="classic"] .card { box-shadow: none; }
html[data-theme="classic"] .btn { border-radius: 3px; }

/* Classic layout: top navigation instead of sidebar */
html[data-theme="classic"] .layout { display: block; }
html[data-theme="classic"] .sidebar {
  width: 100%; height: auto; position: sticky; top: 0;
  flex-direction: row; align-items: center; flex-wrap: wrap;
  padding: 0 8px;
}
html[data-theme="classic"] .sidebar .brand { border-bottom: none; padding: 10px 12px; }
html[data-theme="classic"] .nav { display: flex; flex-wrap: wrap; padding: 4px 8px 10px; flex: 1 1 100%; }
html[data-theme="classic"] .nav .nav-section { display: none; }
html[data-theme="classic"] .nav a { padding: 6px 10px; }
html[data-theme="classic"] .topbar { position: static; }
html[data-theme="classic"] .brand .logo { border-radius: 4px; }

/* --- High contrast accessibility tweak available on all themes --- */
html[data-contrast="high"] { --border: currentColor; }

/* 30-responsive.css */
/* ===== Responsive & mobile ===== */

/* Tablet */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .content { padding: 14px; }
}

/* Mobile */
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span-2 { grid-column: span 1; }
  .kv { grid-template-columns: 110px 1fr; }

  .hamburger { display: inline-flex; }
  .sidebar {
    position: fixed; inset-block: 0; inset-inline-start: 0;
    transform: translateX(105%);
  }
  html[dir="ltr"] .sidebar { transform: translateX(-105%); }
  html[dir="rtl"] .sidebar { transform: translateX(105%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }

  /* Classic theme mobile: nav becomes vertically scrollable row */
  html[data-theme="classic"] .sidebar { position: sticky; transform: none; }
  html[data-theme="classic"] .nav { overflow-x: auto; flex-wrap: nowrap; }
  html[data-theme="classic"] .nav a { flex-shrink: 0; }

  .content { padding: 12px 10px 90px; }
  .topbar { padding: 0 10px; }
  .topbar .save-indicator span.label { display: none; }

  /* tables -> horizontally scrollable, sticky header */
  .table-wrap { -webkit-overflow-scrolling: touch; }

  .modal-overlay { padding: 2vh 8px; align-items: flex-start; }
  .modal-body { max-height: 68vh; }
  .btn { min-height: 40px; }
  .btn-sm { min-height: 32px; }
  .filter-bar .field { max-width: none; }
  #toast-root { inset-inline: 12px; bottom: 12px; max-width: none; }

  /* bottom quick-nav */
  .mobile-tabbar {
    position: fixed; bottom: 0; inset-inline: 0; z-index: 45;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 4px 2px calc(4px + env(safe-area-inset-bottom));
  }
  .mobile-tabbar a {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: .66rem; color: var(--muted); padding: 5px 8px; border-radius: 8px; min-width: 56px;
  }
  .mobile-tabbar a.active { color: var(--accent); }
  .mobile-tabbar .nav-icon { font-size: 1.15rem; }
}
@media (min-width: 769px) {
  .mobile-tabbar { display: none; }
}

/* Very small screens */
@media (max-width: 360px) {
  body { font-size: 13.5px; }
  .stat-card .stat-value { font-size: 1.3rem; }
  .btn { padding: 6px 10px; }
  .content { padding: 10px 8px 90px; }
}

/* Print */
@media print {
  .sidebar, .topbar, .btn, .mobile-tabbar, #toast-root { display: none !important; }
  .content { padding: 0; max-width: none; }
  body { background: #fff; color: #000; }
}

/* 40-widgets.css */
/* ===== Widgets: datepicker, charts, tree ===== */
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.dp-wd { text-align: center; font-size: .72rem; color: var(--muted); padding: 3px 0; font-weight: 600; }
.dp-day { border: none; background: transparent; border-radius: 6px; padding: 6px 0; cursor: pointer; font-size: .84rem; min-height: 30px; }
.dp-day:hover { background: var(--hover); }
.dp-out { opacity: .35; }
.dp-today { box-shadow: inset 0 0 0 1px var(--accent); font-weight: 700; }
.chart-wrap { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.chart-legend { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.chart-center { font-size: 18px; font-weight: 700; fill: var(--text); }
.chart-label { font-size: 10px; fill: var(--muted); }
.chart-val { font-size: 10px; font-weight: 600; fill: var(--text); }
.tree { list-style: none; }
.tree ul { list-style: none; padding-inline-start: 20px; border-inline-start: 1px dashed var(--border); margin-inline-start: 8px; }
.tree details > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.tree details > summary:hover { background: var(--hover); }
.tree details > summary::-webkit-details-marker { display: none; }
.tree .tree-toggle { width: 14px; display: inline-block; color: var(--muted); }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.board-col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; min-height: 120px; }
.board-col h4 { font-size: .85rem; margin: 0 0 8px; color: var(--muted); }
.board-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; margin-bottom: 8px; cursor: pointer; }
.board-card:hover { border-color: var(--accent); }
.hide-sm { display: inline; }
@media (max-width: 768px) { .hide-sm { display: none; } }

/* 50-calendar.css */
/* ===== Calendar grid ===== */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-wd { text-align: center; font-size: .74rem; color: var(--muted); font-weight: 600; padding: 4px 0; }
.cal-cell { min-height: 86px; border: 1px solid var(--border); border-radius: 6px; padding: 4px; background: var(--surface); overflow: hidden; }
.cal-out { opacity: .45; }
.cal-today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-daynum { font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.cal-today .cal-daynum { color: var(--accent); }
.cal-ev { font-size: .7rem; border-radius: 4px; padding: 1px 5px; margin-bottom: 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--accent-soft); color: var(--accent-strong); }
.cal-taskDue { background: var(--warning-soft); color: var(--warning-strong); }
.cal-taskStart { background: var(--accent-soft); color: var(--accent-strong); }
.cal-milestone { background: var(--success-soft); color: var(--success); }
.cal-projectEnd { background: var(--danger-soft); color: var(--danger); }
.cal-more { border: none; background: transparent; color: var(--accent); font-size: .72rem; cursor: pointer; padding: 1px 4px; }
.cal-more:hover { text-decoration: underline; }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-wk-col { border: 1px solid var(--border); border-radius: 6px; padding: 6px; min-height: 200px; background: var(--surface); }
.cal-wk-head { font-size: .78rem; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 4px; margin-bottom: 6px; }
@media (max-width: 768px) {
  .cal-cell { min-height: 64px; padding: 2px; }
  .cal-ev { font-size: .62rem; }
  .cal-week { grid-template-columns: 1fr; }
  .cal-wk-col { min-height: auto; }
}

/* ===== 10-calendar.js ===== */
/* ===== Calendar engine: Gregorian <-> Jalali (algorithmic, no hardcoded ranges) ===== */
const Cal = (function () {
  const div = (a, b) => ~~(a / b);
  const mod = (a, b) => a - ~~(a / b) * b;

  const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];

  function jalCal(jy) {
    const bl = BREAKS.length;
    const gy = jy + 621;
    let leapJ = -14, jp = BREAKS[0], jump = 0;
    if (jy < jp || jy >= BREAKS[bl - 1]) throw new Error('Invalid Jalali year: ' + jy);
    for (let i = 1; i < bl; i++) {
      const jm = BREAKS[i];
      jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    let n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    let leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }

  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4)
      + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }

  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }

  function j2d(jy, jm, jd) {
    const r = jalCal(jy);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }

  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy);
    const jdn1f = g2d(gy, 3, r.march);
    let k = jdn - jdn1f, jm, jd;
    if (k >= 0) {
      if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy, jm, jd }; }
      k -= 186;
    } else {
      jy -= 1; k += 179;
      if (r.leap === 1) k += 1;
    }
    jm = 7 + div(k, 30);
    jd = mod(k, 30) + 1;
    return { jy, jm, jd };
  }

  function isLeapJalali(jy) { return jalCal(jy).leap === 0; }
  function isLeapGregorian(gy) { return (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0; }
  function jalaliMonthLen(jy, jm) {
    if (jm <= 6) return 31;
    if (jm <= 11) return 30;
    return isLeapJalali(jy) ? 30 : 29;
  }
  function gregorianMonthLen(gy, gm) {
    return [31, isLeapGregorian(gy) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][gm - 1];
  }

  /* ISO date strings (YYYY-MM-DD, Gregorian) are the canonical storage format */
  function parseISO(iso) {
    if (!iso || typeof iso !== 'string') return null;
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1) return null;
    if (mo === 2 && d > 29) return null;
    if (d > gregorianMonthLen(y, mo)) return null;
    return { y, m: mo, d };
  }
  function toISO(y, m, d) {
    return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  /* {y,m,d} in the requested calendar system -> ISO gregorian */
  function partsToISO(y, m, d, system) {
    if (system === 'gregorian') return toISO(y, m, d);
    return toISO(...(function () { const g = d2g(j2d(y, m, d)); return [g.gy, g.gm, g.gd]; })());
  }
  /* ISO -> parts in requested system */
  function isoToParts(iso, system) {
    const p = parseISO(iso);
    if (!p) return null;
    if (system === 'gregorian') return { y: p.y, m: p.m, d: p.d };
    const j = d2j(g2d(p.y, p.m, p.d));
    return { y: j.jy, m: j.jm, d: j.jd };
  }

  const FA_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  const EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const FA_WEEKDAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
  const FA_WEEKDAYS_SHORT = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
  const EN_WEEKDAYS = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  const EN_WEEKDAYS_SHORT = ['Sa', 'Su', 'Mo', 'Tu', 'We', 'Th', 'Fr'];

  function systemFor(lang) { return lang === 'fa' ? 'jalali' : 'gregorian'; }

  /* Weekday index (0=Saturday .. 6=Friday) from ISO date */
  function weekdayIndexSat(iso) {
    const p = parseISO(iso);
    const d = new Date(Date.UTC(p.y, p.m - 1, p.d));
    return (d.getUTCDay() + 1) % 7; // JS: 0=Sun..6=Sat -> ours: 0=Sat
  }

  function weekdayName(iso, lang, short) {
    const idx = weekdayIndexSat(iso);
    if (lang === 'fa') return short ? FA_WEEKDAYS_SHORT[idx] : FA_WEEKDAYS[idx];
    return short ? EN_WEEKDAYS_SHORT[idx] : EN_WEEKDAYS[idx];
  }

  function monthName(m, system) {
    return system === 'jalali' ? FA_MONTHS[m - 1] : EN_MONTHS[m - 1];
  }

  function monthLen(y, m, system) {
    return system === 'jalali' ? jalaliMonthLen(y, m) : gregorianMonthLen(y, m);
  }

  function formatISO(iso, lang, opts) {
    opts = opts || {};
    const sys = systemFor(lang);
    const p = isoToParts(iso, sys);
    if (!p) return iso || '';
    if (opts.long) {
      return weekdayName(iso, lang) + '، ' + p.d + ' ' + monthName(p.m, sys) + ' ' + p.y;
    }
    if (opts.medium) return p.d + ' ' + monthName(p.m, sys) + ' ' + p.y;
    return lang === 'fa'
      ? toISO(p.y, p.m, p.d).replace(/-/g, '/')
      : toISO(p.y, p.m, p.d);
  }

  function formatTimestamp(ts, lang, withTime) {
    if (!ts) return '—';
    const d = new Date(ts);
    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    let out = formatISO(iso, lang);
    if (withTime !== false) {
      const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      out += ' ' + hm;
    }
    return out;
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  /* add days to ISO date */
  function addDays(iso, n) {
    const p = parseISO(iso);
    const d = new Date(Date.UTC(p.y, p.m - 1, p.d + n));
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  }
  function diffDays(a, b) {
    const pa = parseISO(a), pb = parseISO(b);
    return Math.round((Date.UTC(pa.y, pa.m - 1, pa.d) - Date.UTC(pb.y, pb.m - 1, pb.d)) / 86400000);
  }
  function addMonths(y, m, n, system) {
    let t = y * 12 + (m - 1) + n;
    return { y: div(t, 12), m: mod(t, 12) + 1 };
  }

  /* first weekday-index (0=Sat) of a month grid start */
  function monthGridStart(y, m, system, weekStart) {
    const firstISO = partsToISO(y, m, 1, system);
    let startIdx = (weekdayIndexSat(firstISO) - weekStart + 7) % 7;
    return { firstISO, startIdx };
  }

  return {
    parseISO, toISO, partsToISO, isoToParts,
    isLeapJalali, isLeapGregorian, jalaliMonthLen, gregorianMonthLen,
    systemFor, weekdayIndexSat, weekdayName, monthName, monthLen,
    formatISO, formatTimestamp, todayISO, addDays, diffDays, addMonths, monthGridStart,
    FA_MONTHS, EN_MONTHS, FA_WEEKDAYS, FA_WEEKDAYS_SHORT, EN_WEEKDAYS, EN_WEEKDAYS_SHORT
  };
})();

          done: ['inprogress'],
          cancelled: ['todo']
        },
        requireResultOnDone: true,
        stages: ['برنامه‌ریزی', 'اجرا', 'بازبینی', 'تحویل']
      },
      project: {
        transitions: {
          planning: ['active', 'cancelled'],
          active: ['onhold', 'completed', 'cancelled'],
          onhold: ['active', 'cancelled'],
          completed: ['active'],
          cancelled: ['planning']
        },
        requireResultOnDone: false,
        stages: []
      }
    };
  },

  defaultPriorities() {
    return [
      { id: 'critical', fa: 'فوری', en: 'Critical', level: 4 },
      { id: 'high', fa: 'بالا', en: 'High', level: 3 },
      { id: 'medium', fa: 'متوسط', en: 'Medium', level: 2 },
      { id: 'low', fa: 'پایین', en: 'Low', level: 1 }
    ];
  },

  fresh() {
    const s = this.defaultState();
    s.roles = this.defaultRoles();
    s.statuses = this.defaultStatuses();
    s.workflow = this.defaultWorkflow();
    s.priorities = this.defaultPriorities();
    return s;
  },

  init() {
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (e) { /* storage unavailable */ }
    const embedded = this.readEmbedded();
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.meta) {
          this.state = parsed;
          this.migrate();
          return { source: 'localStorage' };
        }
      } catch (e) { console.error('corrupt localStorage state', e); }
    }
    if (embedded) {
      this.state = embedded;
      this.migrate();
      this.persist(false);
      return { source: 'embedded' };
    }
    this.state = this.fresh();
    return { source: 'new' };
  },

  readEmbedded() {
    const el = document.getElementById('atlas-embedded-data');
    if (!el) return null;
    try {
      const data = JSON.parse(el.textContent);
      return (data && data.meta) ? data : null;
    } catch (e) { return null; }
  },

  migrate() {
    const s = this.state;
    if (!s.meta.schemaVersion) s.meta.schemaVersion = 1;
    if (s.meta.schemaVersion < SCHEMA_VERSION) {
      Migrations.apply(s, SCHEMA_VERSION);
    }
    const def = this.fresh();
    for (const k in def) if (s[k] === undefined) s[k] = def[k];
    for (const k in def.settings) if (s.settings[k] === undefined) s.settings[k] = def.settings[k];
    if (!s.priorities) s.priorities = this.defaultPriorities();
  },

  persist(markSaved) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(this.state));
      if (markSaved !== false) {
        this.dirty = false;
        this.lastSavedAt = U.nowISO();
      }
      try { localStorage.setItem('atlas-lastsave', this.lastSavedAt || ''); } catch (e) {}
      return true;
    } catch (e) {
      console.error('persist failed', e);
      UI.toast(t('saveFailed', { msg: e.message || 'storage' }), 'error');
      return false;
    }
  },

  markDirty() {
    this.dirty = true;
    if (this.settingsAutosaveEnabled()) SaveSys.scheduleAutosave();
    UI.updateSaveIndicator();
  },

  settingsAutosaveEnabled() {
    return this.state && this.state.settings && this.state.settings.autosave;
  },

  audit(action, target, prev, next) {
    const entry = {
      id: U.uid('aud'),
      at: U.nowISO(),
      actorId: Auth.currentUserId(),
      action, target,
      prev: prev === undefined ? null : prev,
      next: next === undefined ? null : next,
      result: 'ok'
    };
    this.state.auditLog.push(entry);
    if (this.state.auditLog.length > 5000) this.state.auditLog.splice(0, this.state.auditLog.length - 5000);
    this.markDirty();
    return entry;
  },

  /* transaction: apply changes atomically; rollback on exception */
  transaction(fn) {
    const snapshot = U.clone({ data: this.state });
    try {
      const result = fn();
      this.markDirty();
      return { ok: true, result };
    } catch (e) {
      this.state = snapshot.data;
      return { ok: false, error: e };
    }
  },

  nextSeq(kind) {
    this.state.counters[kind] = (this.state.counters[kind] || 0) + 1;
    return this.state.counters[kind];
  }
};

/* ===== 25-auth.js ===== */
/* ===== Authentication ===== */
const Auth = {
  session: null,

  currentUserId() { return this.session ? this.session.userId : null; },
  currentUser() { return this.session ? U.byId(Store.state.users, this.session.userId) : null; },
  currentEmployee() {
    const u = this.currentUser();
    if (!u || !u.employeeId) return null;
    return U.byId(Store.state.employees, u.employeeId);
  },

  login(username, password) {
    const un = String(username || '').trim().toLowerCase();
    const user = Store.state.users.find(u => u.username.toLowerCase() === un);
    if (!user) return { ok: false, error: 'loginFailed' };
    if (user.status !== 'active') return { ok: false, error: 'userDisabled' };
    if (!Passwords.verify(password, user.salt, user.passHash)) return { ok: false, error: 'loginFailed' };
    user.lastLogin = U.nowISO();
    this.session = { userId: user.id, loginAt: U.nowISO() };
    try { localStorage.setItem(LS_SESSION, JSON.stringify(this.session)); } catch (e) {}
    Store.audit('login', 'user:' + user.id);
    Store.persist(false);
    return { ok: true, user };
  },

  restoreSession() {
    try {
      const raw = localStorage.getItem(LS_SESSION);
      if (!raw) return false;
      const s = JSON.parse(raw);
      const user = U.byId(Store.state.users, s.userId);
      if (!user || user.status !== 'active') return false;
      this.session = s;
      return true;
    } catch (e) { return false; }
  },

  logout() {
    const u = this.currentUser();
    if (u) Store.audit('logout', 'user:' + u.id);
    this.session = null;
    try { localStorage.removeItem(LS_SESSION); } catch (e) {}
    Store.persist(false);
  },

  changePassword(user, currentPw, newPw) {
    if (!Passwords.verify(currentPw, user.salt, user.passHash)) return { ok: false, error: 'loginFailed' };
    if (!newPw || newPw.length < 6) return { ok: false, error: 'passwordTooShort' };
    const { salt, hash } = Passwords.make(newPw);
    Store.audit('changePassword', 'user:' + user.id);
    user.salt = salt; user.passHash = hash;
    Store.markDirty();
    return { ok: true };
  },

  adminResetPassword(targetUser, newPw) {
    if (!Perms.can('users', 'edit', targetUser)) throw new Error('permDenied');
    if (!newPw || newPw.length < 6) return { ok: false, error: 'passwordTooShort' };
    const { salt, hash } = Passwords.make(newPw);
    Store.audit('resetPassword', 'user:' + targetUser.id, '***', '***');
    targetUser.salt = salt; targetUser.passHash = hash;
    Store.markDirty();
    return { ok: true };
  }
};

/* ===== 30-perms.js ===== */
/* ===== Permissions engine ===== */
const Perms = {
  MODULES: [
    { id: 'dashboard', ops: ['view'] },
    { id: 'projects', ops: ['view', 'create', 'edit', 'delete', 'assign', 'archive', 'restore', 'export'] },
    { id: 'tasks', ops: ['view', 'create', 'edit', 'delete', 'assign', 'approve', 'export'] },
    { id: 'calendar', ops: ['view'] },
    { id: 'employees', ops: ['view', 'create', 'edit', 'delete', 'archive', 'restore', 'export'] },
    { id: 'org', ops: ['view', 'create', 'edit', 'delete', 'configure'] },
    { id: 'reports', ops: ['view', 'export'] },
    { id: 'notifications', ops: ['view'] },
    { id: 'users', ops: ['view', 'create', 'edit', 'delete'] },
    { id: 'roles', ops: ['view', 'create', 'edit', 'delete'] },
    { id: 'workflow', ops: ['view', 'edit', 'configure'] },
    { id: 'settings', ops: ['view', 'edit', 'configure'] },
    { id: 'backup', ops: ['view', 'create', 'restore'] },
    { id: 'patch', ops: ['view', 'install'] },
    { id: 'audit', ops: ['view'] },
    { id: 'customfields', ops: ['view', 'create', 'edit', 'delete'] }
  ],
  SCOPES: ['all', 'department', 'team', 'assigned', 'own'],

  isAdmin(user) {
    if (!user) return false;
    return (user.roles || []).some(rid => rid === 'role-admin');
  },
  isOrgAdmin(user) {
    if (!user) return false;
    return (user.roles || []).some(rid => rid === 'role-admin' || rid === 'role-orgadmin');
  },

  /* effective permission map: role perms merged, then overrides (deny wins) */
  effective(user) {
    if (!user) return {};
    const eff = {};
    (user.roles || []).forEach(rid => {
      const role = U.byId(Store.state.roles, rid);
      if (!role) return;
      for (const m in role.perms || {}) {
        eff[m] = eff[m] || {};
        for (const op in role.perms[m]) {
          const scope = role.perms[m][op];
          if (!eff[m][op] || this.scopeRank(scope) > this.scopeRank(eff[m][op])) eff[m][op] = scope;
        }
      }
    });
    const ov = user.overrides || {};
    (ov.grants || []).forEach(g => {
      eff[g.module] = eff[g.module] || {};
      if (!eff[g.module][g.op] || this.scopeRank(g.scope) > this.scopeRank(eff[g.module][g.op])) eff[g.module][g.op] = g.scope;
    });
    (ov.denies || []).forEach(d => {
      eff[d.module] = eff[d.module] || {};
      eff[d.module][d.op] = 'none';
    });
    return eff;
  },

  scopeRank(s) {
    return { none: -1, own: 1, assigned: 2, team: 3, department: 4, all: 5 }[s] || 0;
  },

  /* user's organizational context for scope evaluation */
  userContext(user) {
    const emp = user && user.employeeId ? U.byId(Store.state.employees, user.employeeId) : null;
    return {
      userId: user ? user.id : null,
      employeeId: emp ? emp.id : null,
      departmentId: emp ? emp.departmentId : null,
      teamId: emp ? emp.teamId : null
    };
  },

  recordContext(module, record) {
    if (!record) return {};
    const ctx = {
      creatorId: record.creatorId || record.createdBy || null,
      assigneeIds: record.assigneeIds || (record.assigneeId ? [record.assigneeId] : []),
      employeeId: record.employeeId || record.id || null,
      departmentId: record.departmentId || null,
      teamId: record.teamId || null
    };
    if (module === 'projects' && record.memberIds) ctx.assigneeIds = record.memberIds;
    return ctx;
  },

  scopeAllows(scope, uctx, rctx) {
    if (scope === 'all') return true;
    if (scope === 'none') return false;
    if (scope === 'own') return rctx.creatorId === uctx.userId || rctx.employeeId === uctx.employeeId;
    if (scope === 'assigned') return uctx.employeeId && (rctx.assigneeIds || []).includes(uctx.employeeId);
    if (scope === 'team') return uctx.teamId && rctx.teamId === uctx.teamId;
    if (scope === 'department') return uctx.departmentId && rctx.departmentId === uctx.departmentId;
    return false;
  },

  /* tasks inherit project department when unset */
  enrichRecord(module, record) {
    const r = this.recordContext(module, record);
    if (module === 'tasks' && !r.departmentId && record.projectId) {
      const p = U.byId(Store.state.projects, record.projectId);
      if (p) { r.departmentId = p.departmentId; r.teamId = r.teamId || p.teamId; }
    }
    return r;
  },

  /* main check: can current user perform op on module (optionally on a record) */
  can(module, op, record) {
    const user = Auth.currentUser();
    return this.canUser(user, module, op, record);
  },

  canUser(user, module, op, record) {
    if (this.systemMode) return true;
    if (!user || user.status !== 'active') return false;
    const eff = this.effective(user);
    const scope = eff[module] && eff[module][op];
    if (!scope || scope === 'none') return false;
    if (!record) return true;
    const uctx = this.userContext(user);
    const rctx = this.enrichRecord(module, record);
    return this.scopeAllows(scope, uctx, rctx);
  },

  /* filter a record list by view permission */
  visible(module, records) {
    if (this.systemMode) return records;
    const user = Auth.currentUser();
    if (!user) return [];
    const eff = this.effective(user);
    const scope = eff[module] && eff[module].view;
    if (!scope || scope === 'none') return [];
    if (scope === 'all') return records;
    const uctx = this.userContext(user);
    return records.filter(r => this.scopeAllows(scope, uctx, this.enrichRecord(module, r)));
  },

  assert(module, op, record) {
    if (!this.can(module, op, record)) {
      const err = new Error('permDenied');
      err.code = 'permDenied';
      throw err;
    }
  },

  /* simulate effective permissions for the simulator UI */
  simulateUser(userId) {
    const user = U.byId(Store.state.users, userId);
    return user ? this.effective(user) : {};
  }
};

const Org = {
  createDepartment(data) {
    Perms.assert('org', 'create');
    if (!data.name || !data.name.trim()) throw new Error(t('required'));
    if (data.parentId) {
      const parent = U.byId(Store.state.departments, data.parentId);
      if (!parent) throw new Error(t('invalidValue'));
    }
    const dept = {
      id: U.uid('dept'), seq: Store.nextSeq('dept'),
      name: data.name.trim(), parentId: data.parentId || null,
      managerEmployeeId: data.managerEmployeeId || null,
      createdAt: U.nowISO()
    };
    Store.state.departments.push(dept);
    Store.audit('createDepartment', 'department:' + dept.id, null, dept.name);
    Store.markDirty();
    return dept;
  },
  updateDepartment(id, data) {
    const dept = U.byId(Store.state.departments, id);
    if (!dept) throw new Error(t('notFound'));
    Perms.assert('org', 'edit', { departmentId: dept.id });
    if (!data.name || !data.name.trim()) throw new Error(t('required'));
    if (data.parentId === dept.id) throw new Error(t('circularRef'));
    if (data.parentId) {
      let p = U.byId(Store.state.departments, data.parentId);
      if (!p) throw new Error(t('invalidValue'));
      while (p) {
        if (p.id === dept.id) throw new Error(t('circularRef'));
        p = U.byId(Store.state.departments, p.parentId);
      }
    }
    const prev = dept.name;
    dept.name = data.name.trim();
    dept.parentId = data.parentId || null;
    dept.managerEmployeeId = data.managerEmployeeId || null;
    Store.audit('updateDepartment', 'department:' + dept.id, prev, dept.name);
    Store.markDirty();
    return dept;
  },
  deleteDepartment(id) {
    const dept = U.byId(Store.state.departments, id);
    if (!dept) throw new Error(t('notFound'));
    Perms.assert('org', 'delete', { departmentId: dept.id });
    if (Store.state.departments.some(d => d.parentId === id)) throw new Error(t('invalidValue'));
    if (Store.state.employees.some(e => e.departmentId === id && e.status === 'active')) throw new Error(t('invalidValue'));
    Store.state.teams.filter(tm => tm.departmentId === id).forEach(tm => tm.departmentId = null);
    Store.state.departments = Store.state.departments.filter(d => d.id !== id);
    Store.audit('deleteDepartment', 'department:' + id, dept.name, null);
    Store.markDirty();
  },
  createTeam(data) {
    Perms.assert('org', 'create');
    if (!data.name || !data.name.trim()) throw new Error(t('required'));
    const team = {
      id: U.uid('team'), seq: Store.nextSeq('team'),
      name: data.name.trim(), departmentId: data.departmentId || null,
      leadEmployeeId: data.leadEmployeeId || null,
      createdAt: U.nowISO()
    };
    Store.state.teams.push(team);
    Store.audit('createTeam', 'team:' + team.id, null, team.name);
    Store.markDirty();
    return team;
  },
  updateTeam(id, data) {
    const team = U.byId(Store.state.teams, id);
    if (!team) throw new Error(t('notFound'));
    Perms.assert('org', 'edit', { departmentId: team.departmentId });
    if (!data.name || !data.name.trim()) throw new Error(t('required'));
    team.name = data.name.trim();
    team.departmentId = data.departmentId || null;
    team.leadEmployeeId = data.leadEmployeeId || null;
    Store.audit('updateTeam', 'team:' + team.id, null, team.name);
    Store.markDirty();
    return team;
  },
  deleteTeam(id) {
    const team = U.byId(Store.state.teams, id);
    if (!team) throw new Error(t('notFound'));
    Perms.assert('org', 'delete', { departmentId: team.departmentId });
    if (Store.state.employees.some(e => e.teamId === id && e.status === 'active')) throw new Error(t('invalidValue'));
    Store.state.teams = Store.state.teams.filter(x => x.id !== id);
    Store.audit('deleteTeam', 'team:' + id, team.name, null);
    Store.markDirty();

  deptTree() {

      managerId: data.managerId || null,

    if (!data.fullName || !data.fullName.trim()) throw new Error(t('required'));

      if (m.id === id) throw new Error(t('circularRef'));

    }

    emp.fullName = data.fullName.trim();
    emp.empNo = String(data.empNo).trim();

    emp.teamId = data.teamId || null;
    emp.managerId = data.managerId || null;
    emp.email = data.email || '';
    emp.phone = data.phone || '';

  setStatus(id, status) {

    emp.status = status;
    Store.audit(status === 'archived' ? 'archiveEmployee' : 'updateEmployeeStatus', 'employee:' + emp.id, null, status);
    Store.markDirty();
    return emp;

  delete(id) {
    const emp = U.byId(Store.state.employees, id);
    if (!emp) throw new Error(t('notFound'));
    Perms.assert('employees', 'delete', emp);
    if (Store.state.employees.some(e => e.managerId === id && e.status === 'active')) throw new Error(t('invalidValue'));
    const user = Store.state.users.find(u => u.employeeId === id);
    if (user) user.employeeId = null;
    Store.state.employees = Store.state.employees.filter(e => e.id !== id);
    Store.audit('deleteEmployee', 'employee:' + id, emp.fullName, null);
    Store.markDirty();

  displayName(emp) { return emp ? emp.fullName : t('unassigned'); },
  get(id) { return U.byId(Store.state.employees, id); },
  active() { return Store.state.employees.filter(e => e.status === 'active'); },
  workload(empId) {
    return Store.state.tasks.filter(x => (x.assigneeIds || []).includes(empId) && Workflow.kindOf('task', x.status) !== 'done' && Workflow.kindOf('task', x.status) !== 'cancelled' && !x.archived).length;
  }
};

const Users = {
  create(data) {
    Perms.assert('users', 'create');
    const un = String(data.username || '').trim().toLowerCase();
    if (!un || !/^[a-z0-9.]{3,32}$/.test(un)) throw new Error(t('usernameRules'));
    if (Store.state.users.some(u => u.username.toLowerCase() === un)) throw new Error(t('usernameTaken'));
    if (!data.password || data.password.length < 6) throw new Error(t('passwordTooShort'));
    const { salt, hash } = Passwords.make(data.password);
    const user = {
      id: U.uid('usr'), seq: Store.nextSeq('user'),
      username: un,
      displayName: data.displayName || un,
      salt, passHash: hash,
      roles: (data.roles && data.roles.length ? data.roles : ['role-emp']),
      employeeId: data.employeeId || null,
      status: 'active',
      overrides: { grants: [], denies: [] },
      createdAt: U.nowISO(),
      lastLogin: null
    };
    if (user.employeeId) this.checkEmployeeLink(user.employeeId, null);
    Store.state.users.push(user);
    Store.audit('createUser', 'user:' + user.id, null, user.username);
    Store.markDirty();
    return user;
  },
  checkEmployeeLink(employeeId, exceptUserId) {
    if (Store.state.users.some(u => u.employeeId === employeeId && u.id !== exceptUserId)) {
      throw new Error(t('invalidValue') + ' (' + t('linkEmployee') + ')');
    }
  },
  update(id, data) {
    const user = U.byId(Store.state.users, id);
    if (!user) throw new Error(t('notFound'));
    Perms.assert('users', 'edit', user);
    const actor = Auth.currentUser();
    const wasAdmin = Perms.isOrgAdmin(user);
    if (data.displayName) user.displayName = data.displayName;
    if (data.roles !== undefined) {
      if (!Array.isArray(data.roles) || !data.roles.length) throw new Error(t('required'));
      if (wasAdmin && !data.roles.some(r => ['role-admin', 'role-orgadmin'].includes(r))) {
        this.guardLastAdmin(user);
      }
      for (const rid of data.roles) {
        if (!U.byId(Store.state.roles, rid)) throw new Error(t('invalidValue') + ' (' + t('role') + ')');
      }
      user.roles = data.roles;
      Store.audit('changeRoles', 'user:' + user.id, null, data.roles.join(','));
    }
    if (data.employeeId !== undefined) {
      if (data.employeeId) this.checkEmployeeLink(data.employeeId, user.id);
      user.employeeId = data.employeeId || null;
    }
    if (data.status !== undefined) {
      if (user.status === 'active' && data.status !== 'active' && Perms.isOrgAdmin(user)) this.guardLastAdmin(user);
      user.status = data.status;
    }
    Store.audit('updateUser', 'user:' + user.id, null, user.username);
    Store.markDirty();
    return user;
  },
  guardLastAdmin(changedUser) {
    const activeAdmins = Store.state.users.filter(u =>
      u.status === 'active' && u.id !== changedUser.id && Perms.isOrgAdmin(u));
    if (!activeAdmins.length) throw new Error(t('lastAdminError'));
  },
  setStatus(id, status) {
    const user = U.byId(Store.state.users, id);
    if (!user) throw new Error(t('notFound'));
    Perms.assert('users', 'edit', user);
    if (user.status === 'active' && status !== 'active' && Perms.isOrgAdmin(user)) this.guardLastAdmin(user);
    if (user.id === Auth.currentUserId() && status !== 'active') throw new Error(t('lastAdminError'));
    user.status = status;
    Store.audit(status === 'disabled' ? 'disableUser' : 'enableUser', 'user:' + user.id, null, status);
    Store.markDirty();
    return user;
  },
  setOverrides(id, ov) {
    const user = U.byId(Store.state.users, id);
    if (!user) throw new Error(t('notFound'));
    Perms.assert('users', 'edit', user);
    const grants = [], denies = [];
    for (const g of (ov && ov.grants) || []) {
      this.validateOverride(g);
      grants.push({ module: g.module, op: g.op, scope: g.scope });
    }
    for (const d of (ov && ov.denies) || []) {
      this.validateOverride(d, true);
      denies.push({ module: d.module, op: d.op, scope: 'none' });
    }
    user.overrides = { grants, denies };
    Store.audit('setOverrides', 'user:' + user.id,
      JSON.stringify({ g: (ov && ov.grants || []).length, d: (ov && ov.denies || []).length }),
      JSON.stringify({ g: grants.length, d: denies.length }));
    Store.markDirty();
    return user;
  },
  validateOverride(entry, isDeny) {
    const mod = Perms.MODULES.find(m => m.id === entry.module);
    if (!mod) throw new Error(t('invalidValue') + ' (' + t('module') + ')');
    if (!mod.ops.includes(entry.op)) throw new Error(t('invalidValue') + ' (' + t('operation') + ')');
    const scopes = isDeny ? Perms.SCOPES.concat(['none']) : Perms.SCOPES;
    if (!scopes.includes(entry.scope)) throw new Error(t('invalidValue') + ' (' + t('scope') + ')');
  },
  delete(id) {
    const user = U.byId(Store.state.users, id);
    if (!user) throw new Error(t('notFound'));
    Perms.assert('users', 'delete', user);
    if (Perms.isOrgAdmin(user)) this.guardLastAdmin(user);
    if (user.id === Auth.currentUserId()) throw new Error(t('lastAdminError'));
    Store.state.users = Store.state.users.filter(u => u.id !== id);
    Store.audit('deleteUser', 'user:' + id, user.username, null);
    Store.markDirty();
  },
  displayName(user) {
    if (!user) return t('unassigned');
    const emp = user.employeeId ? U.byId(Store.state.employees, user.employeeId) : null;
    return emp ? emp.fullName : (user.displayName || user.username);
  }
};

/* ===== 42-models-work.js ===== */
/* ===== Models: projects, tasks, milestones, notifications ===== */
const Workflow = {
  statuses(kind) { return Store.state.statuses[kind] || []; },
  status(kind, id) { return this.statuses(kind).find(s => s.id === id) || null; },
  statusLabel(kind, id) {
    const s = this.status(kind, id);
    if (!s) return id;
    return I18N.getLang() === 'fa' ? s.fa : s.en;
  },
  kindOf(kind, statusId) {
    const s = this.status(kind, statusId);
    return s ? s.kind : 'active';
  },
  transitions(kind) { return (Store.state.workflow[kind] || {}).transitions || {}; },
  canTransition(kind, from, to) {
    if (from === to) return true;
    return (this.transitions(kind)[from] || []).includes(to);
  },
  validate(kind, from, to, record) {
    if (!this.status(kind, to)) throw new Error(t('invalidValue'));
    if (!this.canTransition(kind, from, to)) throw new Error(t('invalidTransition'));
    const wf = Store.state.workflow[kind] || {};
    if (wf.requireResultOnDone && this.kindOf(kind, to) === 'done') {
      if (!record.resultSummary || !String(record.resultSummary).trim()) throw new Error(t('resultSummary') + ': ' + t('required'));
    }
  },
  stages(kind) { return (Store.state.workflow[kind] || {}).stages || []; },
  saveConfig(kind, cfg) {
    Perms.assert('workflow', 'configure');
    Store.state.workflow[kind] = cfg;
    Store.audit('updateWorkflow', 'workflow:' + kind, null, null);
    Store.markDirty();
  }
};

const Priorities = {

    if (!p) return id || '—';
