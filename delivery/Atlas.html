UI.registerView({
  id: 'projects',
  module: 'projects',
  title: () => t('projects'),
  render(params) {
    this.state = { q: '', status: '', dept: '', archived: false, page: 1 };
    const canCreate = Perms.can('projects', 'create');
    let html = '<div class="filter-bar">' +
      '<div class="field wide"><input type="search" id="prj-q" placeholder="' + t('search') + '…"></div>' +
      '<div class="field">' + Widgets.selectField('f-status', '', Widgets.statusOptions('project'), '', { empty: t('status') }) + '</div>' +
      '<div class="field">' + Widgets.selectField('f-dept', '', Widgets.deptOptions(), '', { empty: t('department') }) + '</div>' +
      (Perms.can('projects', 'archive') ? '<div class="field checkbox-row"><input type="checkbox" id="prj-arch"><label for="prj-arch" style="margin:0">' + t('archived') + '</label></div>' : '') +
      (canCreate ? '<button class="btn btn-primary" id="btn-new-project">+ ' + t('newProject') + '</button>' : '') +
      '</div><div id="prj-list"></div>';
    return html;
  },
  bind() {
    const rerender = () => this.renderList();
    document.getElementById('prj-q').addEventListener('input', U.debounce(e => { this.state.q = e.target.value; this.state.page = 1; rerender(); }, 200));
    document.querySelector('[name="f-status"]').addEventListener('change', e => { this.state.status = e.target.value; rerender(); });
    document.querySelector('[name="f-dept"]').addEventListener('change', e => { this.state.dept = e.target.value; rerender(); });
    const arch = document.getElementById('prj-arch');
    if (arch) arch.addEventListener('change', e => { this.state.archived = e.target.checked; rerender(); });
    const btnNew = document.getElementById('btn-new-project');
    if (btnNew) btnNew.addEventListener('click', () => ProjectViews.openForm(null));
    rerender();
  },
  renderList() {
    const st = this.state;
    let rows = st.archived ? Projects.archivedList() : Projects.visible();
    if (st.q) rows = rows.filter(p => p.title.toLowerCase().includes(st.q.toLowerCase()));
    if (st.status) rows = rows.filter(p => p.status === st.status);
    if (st.dept) rows = rows.filter(p => p.departmentId === st.dept);
    const perPage = 10;
    const page = U.clamp(st.page, 1, Math.max(1, Math.ceil(rows.length / perPage)));
    const slice = rows.slice((page - 1) * perPage, page * perPage);
    const canEdit = Perms.can('projects', 'edit');
    const el = document.getElementById('prj-list');
    if (!rows.length) {
      el.innerHTML = '<div class="card empty-state"><div class="icon">📁</div><p>' + t('projects_empty') + '</p></div>';
      return;
    }
    el.innerHTML = '<div class="card" style="padding:0"><div class="table-wrap"><table class="data-table">' +
      '<thead><tr><th>' + t('projectTitle') + '</th><th>' + t('status') + '</th><th>' + t('priority') + '</th><th>' + t('progress') + '</th><th>' + t('manager') + '</th><th>' + t('endDate') + '</th><th></th></tr></thead><tbody>' +
      slice.map(p => {
        const mgr = p.managerEmployeeId ? Employees.get(p.managerEmployeeId) : null;
        return '<tr data-id="' + p.id + '" style="cursor:pointer">' +
          '<td><a href="#" data-open="' + p.id + '">' + U.esc(p.title) + '</a>' + (p.archived ? ' <span class="pill p-muted">' + t('archived') + '</span>' : '') +
          '<div class="muted small">' + (p.tags || []).map(x => '<span class="tag">' + U.esc(x) + '</span>').join('') + '</div></td>' +
          '<td>' + Widgets.statusPill('project', p.status) + '</td>' +
          '<td>' + Widgets.priorityPill(p.priority) + '</td>' +
          '<td>' + Widgets.progressCell(Projects.progress(p)) + '</td>' +
          '<td>' + U.esc(mgr ? mgr.fullName : t('unassigned')) + '</td>' +
          '<td class="nowrap">' + (p.endDate ? UI.fmtDate(p.endDate) : '—') + (Projects.isDelayed(p) ? ' <span class="pill p-danger">' + t('overdue') + '</span>' : '') + '</td>' +
          '<td class="row-actions">' +
          '<button class="btn btn-sm btn-ghost" data-open="' + p.id + '">' + t('view') + '</button>' +
          (canEdit && !p.archived ? '<button class="btn btn-sm btn-ghost" data-edit="' + p.id + '">' + t('edit') + '</button>' : '') +
          '</td></tr>';
      }).join('') +
      '</tbody></table></div>' + Widgets.pagination(rows.length, page, perPage, p => { st.page = p; this.renderList(); }) + '</div>';
    el.querySelectorAll('[data-open]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); UI.nav('projectDetail', { id: a.dataset.open });
    }));
    el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', e => {
      if (e.target.closest('a,button')) return;
      UI.nav('projectDetail', { id: tr.dataset.id });
    }));
    el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', e => {
      e.stopPropagation();
      ProjectViews.openForm(b.dataset.edit);
    }));
  }
});

const ProjectViews = {

      '<div class="field span-2"><label>' + t('description') + '</label><textarea name="description">' + U.esc(p ? p.description : '') + '</textarea></div>' +
      '<div class="field span-2"><label>' + t('objectives') + '</label><textarea name="objectives" style="min-height:50px">' + U.esc(p ? p.objectives : '') + '</textarea></div>' +

      Widgets.dateField('targetDate', t('targetDate'), p ? p.targetDate : '') +
      Widgets.selectField('status', t('status'), Widgets.statusOptions('project'), p ? p.status : Store.state.settings.defaultProjectStatus) +
      '<div class="field"><label>' + t('members') + '</label><select name="memberIds" multiple size="5">' +
      Widgets.employeeOptions().map(o => '<option value="' + o.value + '"' + (p && (p.memberIds || []).includes(o.value) ? ' selected' : '') + '>' + U.esc(o.label) + '</option>').join('') +
      '</select></div>' +
      '<div class="field"><label>' + t('tags') + '</label>' + Widgets.tagsInput('tags', p ? p.tags : []) + '</div>' +
      '</div>';
    UI.formModal({
      title: p ? t('editProject') : t('newProject'),
      large: true,
      body,
      onMount(el) {
        Widgets.datepicker('df-startDate');
        Widgets.datepicker('df-endDate');
        Widgets.datepicker('df-targetDate');

      onSubmit(form, close) {
        try {
          const data = {
            title: UI.fv(form, 'title'),
            description: UI.fv(form, 'description'),
            objectives: UI.fv(form, 'objectives'),
            managerEmployeeId: UI.fv(form, 'managerEmployeeId') || null,
            departmentId: UI.fv(form, 'departmentId') || null,
            teamId: UI.fv(form, 'teamId') || null,
            priority: UI.fv(form, 'priority'),
            status: UI.fv(form, 'status'),
            startDate: Widgets.getISO(form, 'startDate'),
            endDate: Widgets.getISO(form, 'endDate'),
            targetDate: Widgets.getISO(form, 'targetDate'),
            memberIds: Array.from(form.querySelector('[name="memberIds"]').selectedOptions).map(o => o.value),
            tags: Widgets.parseTags(UI.fv(form, 'tags'))
          };
          if (p) Projects.update(p.id, data); else Projects.create(data);
          close();
          UI.toast(t('savedOk'), 'success');
          UI.render();
        } catch (e) { UI.toast(e.message, 'error'); }
        return false;
      }
    });

};

    const arch = document.getElementById('pd-archive');
    if (arch) arch.addEventListener('click', () => { Projects.setArchived(p.id, true); UI.toast(t('savedOk'), 'success'); UI.nav('projects'); });
    const unarch = document.getElementById('pd-unarchive');
    if (unarch) unarch.addEventListener('click', () => { Projects.setArchived(p.id, false); UI.toast(t('savedOk'), 'success'); UI.render(); });
    const del = document.getElementById('pd-delete');
    if (del) del.addEventListener('click', () => {
      const n = Store.state.tasks.filter(x => x.projectId === p.id).length;
      UI.confirm(t('deleteProjectConfirm', { n }), () => {
        Projects.delete(p.id);
        UI.toast(t('deletedOk'), 'success');
        UI.nav('projects');
      });
    });
    const addMs = document.getElementById('pd-add-ms');
    if (addMs) addMs.addEventListener('click', () => {
      UI.formModal({
        title: t('newMilestone'),
        body: '<div class="field"><label>' + t('title') + ' *</label><input name="title" required></div>' + Widgets.dateField('dueDate', t('dueDate'), ''),
        onMount(el) { Widgets.datepicker('df-dueDate'); },
        onSubmit(form, close) {
          try {
            Projects.addMilestone(p.id, { title: UI.fv(form, 'title'), dueDate: Widgets.getISO(form, 'dueDate') });
            close(); UI.render();
          } catch (e) { UI.toast(e.message, 'error'); }
          return false;
        }
      });
    });
    document.querySelectorAll('[data-ms]').forEach(cb => cb.addEventListener('change', () => {
      try { Projects.toggleMilestone(cb.dataset.ms); UI.render(); } catch (e) { UI.toast(e.message, 'error'); }
    }));
    const addTask = document.getElementById('pd-add-task');
    if (addTask) addTask.addEventListener('click', () => TaskViews.openForm(null, { projectId: p.id }));
    document.querySelectorAll('[data-task]').forEach(tr => tr.addEventListener('click', e => {
      if (e.target.closest('input')) return;
      TaskViews.openDetails(tr.dataset.task);
    }));
    document.querySelectorAll('[data-check]').forEach(cb => cb.addEventListener('change', () => {
      try {
        Tasks.setCompleted(cb.dataset.check, cb.checked);
        UI.toast(cb.checked ? t('taskCompleted') : t('taskReopened'), 'success');
        UI.render();
      } catch (e) {
        cb.checked = !cb.checked;
        UI.toast(e.message, 'error');
      }
    }));
  }
});

/* ===== 82-view-tasks.js ===== */
/* ===== View: Tasks (list, board, details, progress reporting) ===== */
const TaskViews = {
  filters: { q: '', project: '', employee: '', status: '', priority: '', overdue: false, mine: false, page: 1, mode: 'list' },

  openForm(id, presets) {
    presets = presets || {};
    const task = id ? Tasks.get(id) : null;
    if (id) Perms.assert('tasks', 'edit', task); else Perms.assert('tasks', 'create');
    const cf = Store.state.customFields.filter(f => f.appliesTo === 'task');
    const stages = Workflow.stages('task');
    const body = '<div class="form-grid">' +
      (presets.parentId ? '<input type="hidden" name="parentId" value="' + U.esc(presets.parentId) + '">' : '') +
      '<div class="field span-2"><label>' + t('taskTitle') + ' *</label><input name="title" required value="' + U.esc(task ? task.title : '') + '"></div>' +
      '<div class="field span-2"><label>' + t('description') + '</label><textarea name="description">' + U.esc(task ? task.description : '') + '</textarea></div>' +
      Widgets.selectField('projectId', t('project'), Widgets.projectOptions(), task ? task.projectId : presets.projectId, { empty: t('none') }) +
      Widgets.selectField('priority', t('priority'), Widgets.priorityOptions(), task ? task.priority : 'medium') +
      Widgets.selectField('assigneeIds', t('assignee'), Widgets.employeeOptions(), null, { multiple: true }) +
      Widgets.selectField('reviewerId', t('reviewer'), Widgets.employeeOptions(), task ? task.reviewerId : '', { empty: t('select') }) +
      Widgets.dateField('startDate', t('startDate'), task ? task.startDate : '') +
      Widgets.dateField('dueDate', t('dueDate'), task ? task.dueDate : '') +
      Widgets.selectField('status', t('status'), Widgets.statusOptions('task'), task ? task.status : Store.state.settings.defaultTaskStatus) +
      (stages.length ? Widgets.selectField('stage', t('stage'), stages.map(s => ({ value: s, label: s })), task ? task.stage : '') : '') +
      '<div class="field"><label>' + t('tags') + '</label>' + Widgets.tagsInput('tags', task ? task.tags : []) + '</div>' +
      (cf.map(f => '<div class="field"><label>' + U.esc(I18N.getLang() === 'fa' ? (f.labelFa || f.label) : (f.labelEn || f.label)) + '</label>' +
        (f.type === 'select'
          ? '<select name="cf-' + f.id + '"><option value=""></option>' + (f.options || []).map(o => '<option' + (task && task.custom && task.custom[f.id] === o ? ' selected' : '') + '>' + U.esc(o) + '</option>').join('') + '</select>'
          : '<input name="cf-' + f.id + '" type="' + (f.type === 'number' ? 'number' : f.type === 'date' ? 'text' : 'text') + '" value="' + U.esc(task && task.custom ? task.custom[f.id] || '' : '') + '">') +
        '</div>').join('')) +
      '</div>';
    UI.formModal({
      title: task ? t('editTask') : t('newTask'),
      large: true,
      body,
      onMount(el) {
        Widgets.datepicker('df-startDate');
        Widgets.datepicker('df-dueDate');
        if (task) {
          const sel = el.querySelector('[name="assigneeIds"]');
          (task.assigneeIds || []).forEach(aid => {
            const o = sel.querySelector('option[value="' + aid + '"]');
            if (o) o.selected = true;
          });
        }
      },
      onSubmit(form, close) {
        try {
          const custom = {};
          cf.forEach(f => {
            const v = UI.fv(form, 'cf-' + f.id);
            if (v !== undefined && v !== '') custom[f.id] = v;
          });
          const data = {
            title: UI.fv(form, 'title'),
            description: UI.fv(form, 'description'),
            projectId: UI.fv(form, 'projectId') || null,
            parentId: UI.fv(form, 'parentId') || null,
            priority: UI.fv(form, 'priority'),
            assigneeIds: Array.from(form.querySelector('[name="assigneeIds"]').selectedOptions).map(o => o.value),
            reviewerId: UI.fv(form, 'reviewerId') || null,
            startDate: Widgets.getISO(form, 'startDate'),
            dueDate: Widgets.getISO(form, 'dueDate'),
            status: UI.fv(form, 'status'),
            stage: UI.fv(form, 'stage'),
            tags: Widgets.parseTags(UI.fv(form, 'tags')),
            custom
          };
          if (task) Tasks.update(task.id, data); else Tasks.create(data);
          close();
          UI.toast(t('savedOk'), 'success');
          UI.render();
        } catch (e) { UI.toast(e.message, 'error'); }
        return false;
      }
    });
  },

  openDetails(id) {
    const task = Tasks.get(id);
    const canEdit = Perms.can('tasks', 'edit', task);
    const canAssign = Perms.can('tasks', 'assign', task);
    const subtasks = Tasks.subtasks(task.id);
    const deps = (task.deps || []).map(did => Tasks.raw(did)).filter(Boolean);
    const isDone = Workflow.kindOf('task', task.status) === 'done';
    const stages = Workflow.stages('task');
    const body =
      '<dl class="kv">' +
      '<dt>' + t('status') + '</dt><dd>' + Widgets.statusPill('task', task.status) + '</dd>' +
      '<dt>' + t('priority') + '</dt><dd>' + Widgets.priorityPill(task.priority) + '</dd>' +
      '<dt>' + t('project') + '</dt><dd>' + U.esc(Reports.projectName(task.projectId)) + '</dd>' +
      '<dt>' + t('stage') + '</dt><dd>' + U.esc(task.stage || '—') + '</dd>' +
      '<dt>' + t('assignee') + '</dt><dd>' + U.esc(Reports.assigneeNames(task)) + '</dd>' +
      '<dt>' + t('reviewer') + '</dt><dd>' + U.esc(task.reviewerId ? Employees.displayName(Employees.get(task.reviewerId)) : '—') + '</dd>' +
      '<dt>' + t('startDate') + '</dt><dd>' + (task.startDate ? UI.fmtDate(task.startDate) : '—') + '</dd>' +
      '<dt>' + t('dueDate') + '</dt><dd>' + (task.dueDate ? UI.fmtDate(task.dueDate) : '—') + (Tasks.isOverdue(task) ? ' <span class="pill p-danger">' + t('overdue') + '</span>' : '') + '</dd>' +
      '<dt>' + t('completedAt') + '</dt><dd>' + (task.completedAt ? UI.fmtTS(task.completedAt) : '—') + '</dd>' +
      '<dt>' + t('progress') + '</dt><dd>' + Widgets.progressCell(task.progress) + '</dd>' +
      (deps.length ? '<dt>' + t('dependencies') + '</dt><dd>' + deps.map(d => U.esc(d.title) + (Workflow.kindOf('task', d.status) !== 'done' ? ' ⛔' : '')).join('، ') + '</dd>' : '') +
      ((task.tags || []).length ? '<dt>' + t('tags') + '</dt><dd>' + task.tags.map(x => '<span class="tag">' + U.esc(x) + '</span>').join('') + '</dd>' : '') +
      '</dl>' +
      (task.description ? '<p class="muted">' + U.esc(task.description) + '</p>' : '') +
      (task.resultSummary ? '<div class="card" style="background:var(--surface-2)"><b>' + t('resultSummary') + ':</b> ' + U.esc(task.resultSummary) + '</div>' : '') +
      '<div class="btn-row mt-1">' +
      '<label class="btn btn-sm checkbox-row"><input type="checkbox" id="td-done"' + (isDone ? ' checked' : '') + '> ' + t('checkComplete') + '</label>' +
      (canEdit && !isDone ? '<button class="btn btn-sm" id="td-status">' + t('status') + ': ' + U.esc(Workflow.statusLabel('task', task.status)) + '</button>' : '') +
      (canEdit ? '<button class="btn btn-sm" id="td-edit">' + t('edit') + '</button>' : '') +
      (canAssign ? '<button class="btn btn-sm" id="td-assign">' + t('assignee') + '</button>' : '') +
      '<button class="btn btn-sm btn-primary" id="td-progress">' + t('submitProgress') + '</button>' +
      (Perms.can('tasks', 'delete', task) ? '<button class="btn btn-sm btn-danger" id="td-delete">' + t('delete') + '</button>' : '') +
      '</div>' +
      (subtasks.length ? '<h4 class="mt-2">' + t('subtasks') + ' (' + subtasks.length + ')</h4><ul class="timeline">' +
        subtasks.map(s => '<li><div class="tl-head"><input type="checkbox" data-sub="' + s.id + '"' + (Workflow.kindOf('task', s.status) === 'done' ? ' checked' : '') + '> ' +
          '<a href="#" data-sub-open="' + s.id + '">' + U.esc(s.title) + '</a>' + Widgets.statusPill('task', s.status) + Widgets.progressCell(s.progress) + '</div></li>').join('') + '</ul>' : '') +
      (Perms.can('tasks', 'create') ? '<button class="btn btn-sm mt-1" id="td-add-sub">+ ' + t('subtasks') + '</button>' : '') +
      '<h4 class="mt-2">' + t('updateHistory') + ' (' + (task.updates || []).length + ')</h4>' +
      ((task.updates || []).length ? '<ul class="timeline">' + task.updates.slice().reverse().map(u =>
        '<li><div class="tl-head"><b>' + U.esc(Reports.userName(u.authorId)) + '</b><span class="tl-time">' + UI.fmtTS(u.at) + '</span>' +
        (u.progress != null ? '<span class="pill p-info">' + u.progress + '%</span>' : '') +
        (u.stage ? '<span class="pill">' + U.esc(u.stage) + '</span>' : '') +
        (Perms.can('tasks', 'approve', task) ? '<button class="btn btn-sm btn-ghost" data-del-upd="' + u.id + '">🗑</button>' : '') + '</div>' +
        '<div>' + U.esc(u.description) + '</div>' +
        (u.result ? '<div class="small"><b>' + t('reportedResult') + ':</b> ' + U.esc(u.result) + '</div>' : '') +
        (u.problems ? '<div class="small text-warn"><b>' + t('problems') + ':</b> ' + U.esc(u.problems) + '</div>' : '') +
        (u.nextSteps ? '<div class="small"><b>' + t('nextSteps') + ':</b> ' + U.esc(u.nextSteps) + '</div>' : '') + '</li>').join('') + '</ul>'
        : '<div class="empty-state small">' + t('noData') + '</div>') +
      '<h4 class="mt-2">' + t('comments') + ' (' + (task.comments || []).length + ')</h4>' +
      ((task.comments || []).map(c => '<div class="card mb-1" style="padding:8px 12px"><b class="small">' + U.esc(Reports.userName(c.authorId)) + '</b> <span class="muted small">' + UI.fmtTS(c.at) + '</span><div>' + U.esc(c.text) + '</div></div>').join('') || '') +
      '<div class="flex mt-1"><input type="text" id="td-comment" placeholder="' + t('addComment') + '"><button class="btn btn-sm" id="td-comment-add">' + t('add') + '</button></div>' +
      '<h4 class="mt-2">' + t('attachments') + '</h4>' +
      ((task.attachments || []).map(a => '<div class="flex-between mb-1"><span>📎 ' + U.esc(a.name) + ' <span class="muted small">' + U.fmtBytes(a.size) + '</span></span>' +
        '<button class="btn btn-sm" data-dl-att="' + a.id + '">' + t('export') + '</button></div>').join('') || '') +
      (canEdit ? '<div class="flex mt-1"><input type="text" id="att-name" placeholder="' + t('fileName') + '"><input type="text" id="att-content" placeholder="' + t('fileContent') + '"><button class="btn btn-sm" id="att-add">' + t('attachments_add') + '</button></div>' : '') +
      '<h4 class="mt-2">' + t('history') + '</h4>' +
      ((task.history || []).slice().reverse().map(h => '<div class="small mb-1"><span class="muted">' + UI.fmtTS(h.at) + '</span> — ' + U.esc(Reports.userName(h.actorId)) + ' — ' + U.esc(h.action) + '</div>').join(''));

    const m = UI.modal({
      title: U.esc(task.title),
      large: true,
      body,
      foot: null
    });
    const done = m.el.querySelector('#td-done');
    if (done) done.addEventListener('change', () => {
      try {
        Tasks.setCompleted(task.id, done.checked);
        UI.toast(done.checked ? t('taskCompleted') : t('taskReopened'), 'success');
        m.close();
        UI.render();
      } catch (e) {
        done.checked = !done.checked;
        if (e.code === 'resultRequired') {
          m.close();
          this.openProgressForm(task.id, { requireResult: true });
        } else UI.toast(e.message, 'error');
      }
    });
    const statusBtn = m.el.querySelector('#td-status');
    if (statusBtn) statusBtn.addEventListener('click', () => {
      const allowed = (Workflow.transitions('task')[task.status] || []);
      if (!allowed.length) { UI.toast(t('invalidTransition'), 'warn'); return; }
      UI.formModal({
        title: t('status'),
        body: Widgets.selectField('status', t('status'), allowed.map(s => ({ value: s, label: Workflow.statusLabel('task', s) })), task.status) +
          '<div class="field"><label>' + t('resultSummary') + '</label><textarea name="resultSummary" style="min-height:50px">' + U.esc(task.resultSummary || '') + '</textarea></div>',
        onSubmit(f, close) {
          try {
            task.resultSummary = UI.fv(f, 'resultSummary');
            Tasks.setStatus(task, UI.fv(f, 'status'), {});
            close(); m.close(); UI.render();
            UI.toast(t('savedOk'), 'success');
          } catch (e) { UI.toast(e.message, 'error'); }
          return false;
        }
      });
    });
    const editBtn = m.el.querySelector('#td-edit');
    if (editBtn) editBtn.addEventListener('click', () => { m.close(); TaskViews.openForm(task.id); });
    const assignBtn = m.el.querySelector('#td-assign');
    if (assignBtn) assignBtn.addEventListener('click', () => {
      UI.formModal({
        title: t('assignee'),
        body: '<div class="field"><select name="assigneeIds" multiple size="6">' +
          Widgets.employeeOptions().map(o => '<option value="' + o.value + '"' + ((task.assigneeIds || []).includes(o.value) ? ' selected' : '') + '>' + U.esc(o.label) + '</option>').join('') + '</select></div>',
        onSubmit(f, close) {
          try {
            Tasks.assign(task.id, Array.from(f.querySelector('[name="assigneeIds"]').selectedOptions).map(o => o.value));
            close(); m.close(); UI.render();
            UI.toast(t('savedOk'), 'success');
          } catch (e) { UI.toast(e.message, 'error'); }
          return false;
        }
      });
    });
    const progBtn = m.el.querySelector('#td-progress');
    if (progBtn) progBtn.addEventListener('click', () => { m.close(); TaskViews.openProgressForm(task.id); });
    const delBtn = m.el.querySelector('#td-delete');
    if (delBtn) delBtn.addEventListener('click', () => {
      UI.confirm(t('deleteTaskConfirm'), () => {
        Tasks.delete(task.id);
        m.close();
        UI.toast(t('deletedOk'), 'success');
        UI.render();
      });
    });
    const addSub = m.el.querySelector('#td-add-sub');
    if (addSub) addSub.addEventListener('click', () => { m.close(); TaskViews.openForm(null, { parentId: task.id, projectId: task.projectId }); });
    m.el.querySelectorAll('[data-sub]').forEach(cb => cb.addEventListener('change', () => {
      try {
        Tasks.setCompleted(cb.dataset.sub, cb.checked);
        m.close(); UI.render();
      } catch (e) { cb.checked = !cb.checked; UI.toast(e.message, 'error'); }
    }));
    m.el.querySelectorAll('[data-sub-open]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault(); m.close(); TaskViews.openDetails(a.dataset.subOpen);
    }));
    m.el.querySelectorAll('[data-del-upd]').forEach(b => b.addEventListener('click', () => {
      UI.confirm(t('confirmDelete'), () => {
        try { Tasks.deleteUpdate(task.id, b.dataset.delUpd); m.close(); TaskViews.openDetails(task.id); } catch (e) { UI.toast(e.message, 'error'); }
      });
    }));
    const cmtAdd = m.el.querySelector('#td-comment-add');
    if (cmtAdd) cmtAdd.addEventListener('click', () => {
      try {
        Tasks.addComment(task.id, m.el.querySelector('#td-comment').value);
        m.close(); TaskViews.openDetails(task.id);
      } catch (e) { UI.toast(e.message, 'error'); }
    });
    const attAdd = m.el.querySelector('#att-add');
    if (attAdd) attAdd.addEventListener('click', () => {
      try {
        Tasks.addAttachment(task.id, { name: m.el.querySelector('#att-name').value, content: m.el.querySelector('#att-content').value });
        m.close(); TaskViews.openDetails(task.id);
      } catch (e) { UI.toast(e.message, 'error'); }
    });
    m.el.querySelectorAll('[data-dl-att]').forEach(b => b.addEventListener('click', () => {
      const a = (task.attachments || []).find(x => x.id === b.dataset.dlAtt);
      if (a) U.download(a.name, a.content, 'text/plain;charset=utf-8');
    }));
  },

  openProgressForm(id, opts) {
    opts = opts || {};
    const task = Tasks.get(id);
    const stages = Workflow.stages('task');
    const doneId = Tasks.doneStatusId();
    const allowed = (Workflow.transitions('task')[task.status] || [])
      .filter(s => Workflow.kindOf('task', s) !== 'done');
    const statusOptions = [{ value: '', label: t('none') }].concat(allowed.map(s => ({ value: s, label: Workflow.statusLabel('task', s) })));
    const defaultStatus = '';
    UI.formModal({
      title: t('submitProgress') + ' — ' + U.esc(task.title),
      body:
        '<div class="field"><label>' + t('workDone') + ' *</label><textarea name="description" required></textarea></div>' +
        '<div class="form-grid">' +
        '<div class="field"><label>' + t('newProgress') + '</label><input type="number" name="progress" min="0" max="100" value="' + U.num(task.progress) + '"></div>' +
        (stages.length ? Widgets.selectField('stage', t('stage'), stages.map(s => ({ value: s, label: s })), task.stage || '') : '') +
        (allowed.length ? Widgets.selectField('status', t('status'), statusOptions, defaultStatus) : '') +
        '</div>' +
        '<div class="field"><label>' + t('reportedResult') + '</label><textarea name="result" style="min-height:44px">' + U.esc(task.resultSummary || '') + '</textarea></div>' +
        '<div class="field"><label>' + t('problems') + '</label><textarea name="problems" style="min-height:44px"></textarea></div>' +
        '<div class="field"><label>' + t('nextSteps') + '</label><textarea name="nextSteps" style="min-height:44px"></textarea></div>',
      onSubmit(form, close) {
        try {
          Tasks.addProgressUpdate(task.id, {
            description: UI.fv(form, 'description'),
            progress: UI.fv(form, 'progress'),
            stage: UI.fv(form, 'stage'),
            status: UI.fv(form, 'status') || null,
            result: UI.fv(form, 'result'),
            problems: UI.fv(form, 'problems'),
            nextSteps: UI.fv(form, 'nextSteps')
          });
          if (opts.requireResult) Tasks.setCompleted(task.id, true);
          close();
          UI.toast(t('savedOk'), 'success');
          UI.render();
        } catch (e) { UI.toast(e.message, 'error'); }
        return false;
      }
    });
  }
};

UI.registerView({

  },
  filtered() {
    const f = TaskViews.filters;
    let rows = Tasks.visible().filter(x => !x.parentId);
    if (f.q) rows = rows.filter(x => (x.title + ' ' + (x.description || '')).toLowerCase().includes(f.q.toLowerCase()));
    if (f.project) rows = rows.filter(x => x.projectId === f.project);
    if (f.employee) rows = rows.filter(x => (x.assigneeIds || []).includes(f.employee));
    if (f.status) rows = rows.filter(x => x.status === f.status);
    if (f.priority) rows = rows.filter(x => x.priority === f.priority);
    if (f.overdue) rows = rows.filter(x => Tasks.isOverdue(x));
    if (f.mine) {
      const me = Auth.currentEmployee();
      rows = rows.filter(x => me && (x.assigneeIds || []).includes(me.id));
    }
    return rows;
  },
  renderList() {
    const f = TaskViews.filters;
    const rows = this.filtered();
    const el = document.getElementById('tk-list');
    if (f.mode === 'board') {
      const cols = Workflow.statuses('task').filter(s => s.kind !== 'cancelled');
      el.innerHTML = '<div class="board">' + cols.map(c => {
        const items = rows.filter(x => x.status === c.id);

          items.map(x => '<div class="board-card" data-task="' + x.id + '"><b>' + U.esc(x.title) + '</b>' +
            '<div class="small muted">' + U.esc(Reports.projectName(x.projectId)) + '</div>' +
            Widgets.progressCell(x.progress) + '</div>').join('') + '</div>';
      }).join('') + '</div>';
      el.querySelectorAll('[data-task]').forEach(c => c.addEventListener('click', () => TaskViews.openDetails(c.dataset.task)));
      return;
    }
    if (!rows.length) {
      el.innerHTML = '<div class="card empty-state"><div class="icon">✅</div><p>' + t('tasks_empty') + '</p></div>';
      return;
    }
    const perPage = 12;
    const page = U.clamp(f.page, 1, Math.max(1, Math.ceil(rows.length / perPage)));
    const slice = rows.slice((page - 1) * perPage, page * perPage);
    const canDelete = Perms.can('tasks', 'delete');
    const canEdit = Perms.can('tasks', 'edit');
    el.innerHTML = '<div class="card" style="padding:0"><div class="table-wrap"><table class="data-table">' +
      '<thead><tr><th></th><th>' + t('taskTitle') + '</th><th>' + t('project') + '</th><th>' + t('status') + '</th><th>' + t('stage') + '</th><th>' + t('progress') + '</th><th>' + t('dueDate') + '</th><th>' + t('assignee') + '</th><th></th></tr></thead><tbody>' +
      slice.map(x => '<tr data-task="' + x.id + '" style="cursor:pointer">' +
        '<td><input type="checkbox" data-check="' + x.id + '"' + (Workflow.kindOf('task', x.status) === 'done' ? ' checked' : '') + ' aria-label="' + t('checkComplete') + '"></td>' +
        '<td>' + U.esc(x.title) +
        (Tasks.isBlocked(x) ? ' <span class="pill p-warn" title="' + t('taskBlocked') + '">⛔</span>' : '') +
        (Tasks.isOverdue(x) ? ' <span class="pill p-danger">' + t('overdue') + '</span>' : '') +
        '<div class="muted small">' + (x.tags || []).map(tg => '<span class="tag">' + U.esc(tg) + '</span>').join('') + '</div></td>' +
        '<td>' + U.esc(Reports.projectName(x.projectId)) + '</td>' +
        '<td>' + Widgets.statusPill('task', x.status) + '</td>' +
        '<td>' + U.esc(x.stage || '—') + '</td>' +
        '<td>' + Widgets.progressCell(x.progress) + '</td>' +
        '<td class="nowrap">' + (x.dueDate ? UI.fmtDate(x.dueDate) : '—') + '</td>' +
        '<td>' + U.esc(Reports.assigneeNames(x)) + '</td>' +

        (canDelete ? '<button class="btn btn-sm btn-ghost" data-del="' + x.id + '">🗑</button>' : '') + '</td></tr>').join('') +
      '</tbody></table></div>' + Widgets.pagination(rows.length, page, perPage, p => { f.page = p; this.renderList(); }) + '</div>';
    el.querySelectorAll('tr[data-task]').forEach(tr => tr.addEventListener('click', e => {
      if (e.target.closest('input,button')) return;
      TaskViews.openDetails(tr.dataset.task);
    }));
    el.querySelectorAll('[data-check]').forEach(cb => cb.addEventListener('change', () => {
      try {

UI.registerView({
  id: 'calendar',
  module: 'calendar',
  title: () => t('calendar'),
  render() {
    const lang = I18N.getLang();
    const sys = Cal.systemFor(lang);
    const today = Cal.isoToParts(Cal.todayISO(), sys);
    this.st = { sys, y: today.y, m: today.m, day: today.d, mode: 'month', filter: '' };
    return '<div class="filter-bar">' +
      '<button class="btn btn-sm" id="cal-prev">‹</button>' +
      '<button class="btn btn-sm" id="cal-today">' + t('today') + '</button>' +
      '<button class="btn btn-sm" id="cal-next">›</button>' +
      '<span class="pill" id="cal-title"></span>' +
      '<span class="grow"></span>' +
      '<button class="btn btn-sm" data-mode="month">' + t('monthView') + '</button>' +
      '<button class="btn btn-sm" data-mode="week">' + t('weekView') + '</button>' +
      '<button class="btn btn-sm" data-mode="day">' + t('dayView') + '</button>' +
      '<div class="field" style="max-width:180px"><select id="cal-filter"><option value="">' + t('filterEvents') + '</option>' +
      '<option value="taskDue">' + t('calendar_taskDue') + '</option>' +
      '<option value="taskStart">' + t('calendar_taskStart') + '</option>' +
      '<option value="milestone">' + t('calendar_milestone') + '</option>' +
      '<option value="projectEnd">' + t('calendar_projectEnd') + '</option></select></div>' +
      '</div><div id="cal-body"></div>';
  },
  bind() {
    const rerender = () => this.renderBody();
    document.getElementById('cal-prev').addEventListener('click', () => this.nav(-1));
    document.getElementById('cal-next').addEventListener('click', () => this.nav(1));
    document.getElementById('cal-today').addEventListener('click', () => {
      const p = Cal.isoToParts(Cal.todayISO(), this.st.sys);
      this.st.y = p.y; this.st.m = p.m; this.st.day = p.d; rerender();
    });
    document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
      this.st.mode = b.dataset.mode; rerender();
    }));
    document.getElementById('cal-filter').addEventListener('change', e => { this.st.filter = e.target.value; rerender(); });
    rerender();
  },
  nav(dir) {
    const st = this.st;
    if (st.mode === 'month') {
      const nm = Cal.addMonths(st.y, st.m, dir, st.sys);
      st.y = nm.y; st.m = nm.m;
    } else if (st.mode === 'week') {
      const iso = this.selISO();
      const target = Cal.addDays(iso, dir * 7);
      const p = Cal.isoToParts(target, st.sys);
      st.y = p.y; st.m = p.m; st.day = p.d;
    } else {
      const target = Cal.addDays(this.selISO(), dir);
      const p = Cal.isoToParts(target, st.sys);
      st.y = p.y; st.m = p.m; st.day = p.d;
    }
    this.renderBody();
  },
  selISO() {
    return Cal.partsToISO(this.st.y, this.st.m, this.st.day, this.st.sys);
  },
  events(rangeFrom, rangeTo) {
    const st = this.st;
    const evts = [];
    const tasks = Perms.visible('tasks', Store.state.tasks.filter(x => !x.archived));
    tasks.forEach(x => {
      if (x.dueDate) evts.push({ iso: x.dueDate, type: 'taskDue', ref: x, label: '⏰ ' + x.title });
      if (x.startDate) evts.push({ iso: x.startDate, type: 'taskStart', ref: x, label: '▶ ' + x.title });
    });
    const projects = Projects.visible();
    projects.forEach(p => {
      if (p.endDate) evts.push({ iso: p.endDate, type: 'projectEnd', ref: p, label: '🏁 ' + p.title });
      Projects.projectMilestones(p.id).forEach(m => {
        if (m.dueDate) evts.push({ iso: m.dueDate, type: 'milestone', ref: { p, m }, label: '◆ ' + m.title });
      });
    });
    return evts.filter(e => (!st.filter || e.type === st.filter) && e.iso >= rangeFrom && e.iso <= rangeTo);
  },
  renderBody() {
    const st = this.st;
    const el = document.getElementById('cal-body');
    const title = document.getElementById('cal-title');
    const monthName = Cal.monthName(st.m, st.sys);
    if (st.mode === 'month') {
      title.textContent = monthName + ' ' + st.y;
      const grid = Cal.monthGridStart(st.y, st.m, st.sys, Store.state.settings.weekStart);
      const startISO = Cal.addDays(grid.firstISO, -grid.startIdx);
      const endISO = Cal.addDays(startISO, 41);
      const evts = this.events(startISO, endISO);
      const wds = st.sys === 'jalali' ? Cal.FA_WEEKDAYS_SHORT : Cal.EN_WEEKDAYS_SHORT;
      let html = '<div class="card" style="padding:10px"><div class="cal-grid">';
      html += wds.map(w => '<div class="cal-wd">' + w + '</div>').join('');
      for (let i = 0; i < 42; i++) {
        const iso = Cal.addDays(startISO, i);
        const p = Cal.isoToParts(iso, st.sys);
        const inMonth = p.m === st.m && p.y === st.y;
        const dayEvts = evts.filter(e => e.iso === iso);
        html += '<div class="cal-cell' + (inMonth ? '' : ' cal-out') + (iso === Cal.todayISO() ? ' cal-today' : '') + '" data-date="' + iso + '">' +
          '<div class="cal-daynum seq-num">' + p.d + '</div>' +
          dayEvts.slice(0, 3).map(e => '<div class="cal-ev cal-' + e.type + '" data-evt="' + e.type + '" data-ref="' + (e.ref.id || '') + '" title="' + U.esc(e.label) + '">' + U.esc(U.truncate(e.label, 22)) + '</div>').join('') +
          (dayEvts.length > 3 ? '<button class="cal-more" data-date="' + iso + '">+' + (dayEvts.length - 3) + ' ' + t('more') + '</button>' : '') +
          '</div>';
      }
      html += '</div></div>';
      el.innerHTML = html;
      this.bindEvents(el);
      return;
    }
    if (st.mode === 'week') {
      const sel = this.selISO();
      const idx = Cal.weekdayIndexSat(sel);
      const weekStart = Cal.addDays(sel, -(idx - Store.state.settings.weekStart + 7) % 7);
      const endISO = Cal.addDays(weekStart, 6);
      title.textContent = Cal.formatISO(weekStart, I18N.getLang(), { medium: true }) + ' — ' + Cal.formatISO(endISO, I18N.getLang(), { medium: true });
      const evts = this.events(weekStart, endISO);
      let html = '<div class="card" style="padding:10px"><div class="cal-week">';
      for (let i = 0; i < 7; i++) {
        const iso = Cal.addDays(weekStart, i);
        const dayEvts = evts.filter(e => e.iso === iso);
        html += '<div class="cal-wk-col' + (iso === Cal.todayISO() ? ' cal-today' : '') + '"><div class="cal-wk-head">' + Cal.weekdayName(iso, I18N.getLang()) + '<div class="seq-num">' + Cal.isoToParts(iso, st.sys).d + '</div></div>' +
          dayEvts.map(e => '<div class="cal-ev cal-' + e.type + '" data-evt="' + e.type + '" data-ref="' + (e.ref.id || '') + '">' + U.esc(e.label) + '</div>').join('') + '</div>';
      }
      el.innerHTML = html + '</div></div>';
      this.bindEvents(el);
      return;
    }
    const iso = this.selISO();
    title.textContent = Cal.formatISO(iso, I18N.getLang(), { long: true });
    const dayEvts = this.events(iso, iso);
    el.innerHTML = '<div class="card">' + (dayEvts.length ?
      '<ul class="timeline">' + dayEvts.map(e => '<li><div class="tl-head"><span class="cal-ev cal-' + e.type + '">' + U.esc(e.label) + '</span>' +
        '<button class="btn btn-sm" data-evt="' + e.type + '" data-ref="' + (e.ref.id || '') + '">' + t('goToRecord') + '</button></div></li>').join('') + '</ul>'
      : '<div class="empty-state">' + t('noData') + '</div>') + '</div>';
    this.bindEvents(el);
  },
  bindEvents(el) {
    el.querySelectorAll('.cal-more').forEach(b => b.addEventListener('click', () => {
      const iso = b.dataset.date;
      const evts = this.events(iso, iso);
      UI.modal({
        title: t('events') + ' — ' + Cal.formatISO(iso, I18N.getLang()),
        body: '<ul class="timeline">' + evts.map(e => '<li><div class="tl-head"><span class="cal-ev cal-' + e.type + '">' + U.esc(e.label) + '</span>' +
          '<button class="btn btn-sm" data-evt="' + e.type + '" data-ref="' + (e.ref.id || '') + '">' + t('goToRecord') + '</button></div></li>').join('') + '</ul>'
      });
      this.bindGoButtons(document.getElementById('modal-root'));
    }));
    this.bindGoButtons(el);
  },
  bindGoButtons(root) {
    root.querySelectorAll('[data-evt]').forEach(elm => {
      if (elm.classList.contains('cal-ev') && !elm.classList.contains('clickable')) return;
      elm.addEventListener('click', e => {
        e.stopPropagation();
        const type = elm.dataset.evt, ref = elm.dataset.ref;
        if (!ref) return;
        if (type === 'milestone') {
          const ms = U.byId(Store.state.milestones, ref);
          if (ms) UI.nav('projectDetail', { id: ms.projectId });
        } else if (type === 'projectEnd') {
          UI.nav('projectDetail', { id: ref });
        } else {
          TaskViews.openDetails(ref);
        }
      });
    });
  }
});

        '</select><div class="hint">' + t('permsApplied') + '</div></div>' +
        '</div>',
      onSubmit(form, close) {
        try {
          const roles = Array.from(form.querySelector('[name="roles"]').selectedOptions).map(o => o.value);
          if (user) {
            Users.update(user.id, {
              displayName: UI.fv(form, 'displayName') || user.displayName,
              roles, employeeId: UI.fv(form, 'employeeId') || null
            });
          } else {
            Users.create({
              username: UI.fv(form, 'username'), displayName: UI.fv(form, 'displayName'),
              password: UI.fv(form, 'password'), roles, employeeId: UI.fv(form, 'employeeId') || null
            });
          }
          close(); UI.toast(t('roleChanged'), 'success'); UI.render();
        } catch (e) { UI.toast(e.message, 'error'); }
        return false;
      }
    });
  },

  permMatrixEditor(role, onSave) {
    const modules = Perms.MODULES;
    const scopes = Perms.SCOPES;
    let html = '<div class="table-wrap" style="max-height:420px;overflow-y:auto"><table class="data-table"><thead><tr><th>' + t('module') + '</th>' +
      ['view', 'create', 'edit', 'delete', 'assign', 'approve', 'export', 'archive', 'restore', 'configure'].map(op => '<th>' + t('op_' + op) + '</th>').join('') + '</tr></thead><tbody>';
    modules.forEach(m => {
      html += '<tr><td><b>' + U.esc(t(m.id === 'customfields' ? 'customFields' : m.id === 'patch' ? 'patchCenter' : m.id)) + '</b></td>';
      m.ops.forEach(op => {
        const cur = (role.perms[m.id] && role.perms[m.id][op]) || '';
        html += '<td><select data-m="' + m.id + '" data-op="' + op + '" style="min-width:86px">' +
          '<option value=""></option>' + scopes.map(s => '<option value="' + s + '"' + (cur === s ? ' selected' : '') + '>' + t('scope_' + s) + '</option>').join('') + '</select></td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  },

  collectMatrix(container) {
    const perms = {};
    container.querySelectorAll('select[data-m]').forEach(sel => {
      if (!sel.value) return;
      perms[sel.dataset.m] = perms[sel.dataset.m] || {};
      perms[sel.dataset.m][sel.dataset.op] = sel.value;
    });
    return perms;
  }
};

AdminViews.simulator = function () {
  const userOpts = Store.state.users.map(u => ({ value: u.id, label: Users.displayName(u) + ' (' + u.username + ')' }));
  UI.formModal({
    title: t('permSimulator'),
    body: Widgets.selectField('userId', t('users'), userOpts, Store.state.users[0] ? Store.state.users[0].id : '') + '<div id="sim-result"></div>',
    onMount(el) {
      const render = () => {
        const uid = el.querySelector('[name="userId"]').value;
        const eff = Perms.simulateUser(uid);
        const u = U.byId(Store.state.users, uid);
        let html = '<div class="mb-1">' + (u.roles || []).map(r => '<span class="pill p-info">' + U.esc(Roles.roleLabelById(r)) + '</span>').join(' ') + '</div>';
        html += '<div class="table-wrap" style="max-height:300px;overflow-y:auto"><table class="data-table"><thead><tr><th>' + t('module') + '</th><th>' + t('permission') + '</th></tr></thead><tbody>';
        Perms.MODULES.forEach(m => {
          const ops = eff[m.id] ? Object.entries(eff[m.id]) : [];
          if (!ops.length) return;
          html += '<tr><td><b>' + U.esc(t(m.id === 'customfields' ? 'customFields' : m.id === 'patch' ? 'patchCenter' : m.id)) + '</b></td><td>' +
            ops.map(([op, scope]) => '<span class="pill">' + t('op_' + op) + ': ' + t('scope_' + scope) + '</span>').join(' ') + '</td></tr>';
        });
        html += '</tbody></table></div>';
        el.querySelector('#sim-result').innerHTML = html;
      };
      el.querySelector('[name="userId"]').addEventListener('change', render);
      render();
    },
    onSubmit: () => false
  });
};

      try {
        document.querySelectorAll('input[data-k],select[data-k]').forEach(el => {

          const tr = Store.state.workflow[kind].transitions;
          Object.keys(tr).forEach(k => delete tr[k]);
          document.querySelectorAll('input[data-tr-kind="' + kind + '"]:checked').forEach(cb => {
            tr[cb.dataset.from] = tr[cb.dataset.from] || [];

        Store.markDirty();
        UI.toast(t('workflowSaved'), 'success');
      } catch (e) { UI.toast(e.message, 'error'); }

UI.registerView({
  id: 'backup', module: 'backup',
  title() { return t('backup'); },
  render() {
    return '<div class="grid-2">' +
      '<div class="card"><h3>' + t('createBackup') + '</h3>' +
      '<p class="muted">' + U.esc(t('saveAppDesc')) + '</p>' +
      '<button class="btn btn-primary" id="bk-create">' + t('downloadBackup') + '</button>' +
      '<div class="kv mt-2"><div>' + t('backupFormatVersion') + '</div><div>' + BACKUP_FORMAT_VERSION + '</div>' +
      '<div>' + t('schemaVersion') + '</div><div>' + Store.state.meta.schemaVersion + '</div></div></div>' +
      '<div class="card"><h3>' + t('restoreBackup') + '</h3>' +
      '<p class="muted">' + U.esc(t('restoreFull')) + '</p>' +
      '<button class="btn" id="bk-restore">' + t('selectBackupFile') + '</button>' +
      '<div class="kv mt-2"><div>' + t('recoveryBackup') + '</div><div>' + t('restoreFull') + '</div></div></div>' +
      '</div>';
  },
  bind() {
    document.getElementById('bk-create').addEventListener('click', () => {
      try {
        const b = Backup.create();
        U.download('atlas-backup-' + Cal.todayISO() + '.json', JSON.stringify(b, null, 1), 'application/json');
        UI.toast(t('backupCreated'), 'success');
      } catch (e) { UI.toast(t('error') + ': ' + (e.message || e), 'error'); }
    });
    document.getElementById('bk-restore').addEventListener('click', () => this.wizard());
  },
  wizard() {
    let backup = null, validation = null, compat = null;
    const modal = UI.modal({
      title: t('restoreWizard'),
      large: true,
      body: '<div id="rw-body"></div>',
      foot: '<button class="btn" data-close>' + t('cancel') + '</button><button class="btn btn-primary" id="rw-next" disabled>' + t('next') + '</button>',
      onMount(el, close) {
        const body = el.querySelector('#rw-body');
        const next = el.querySelector('#rw-next');
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.json,application/json';
        fileInput.style.display = 'none';
        el.appendChild(fileInput);
        const stepSelect = () => {
          next.disabled = true;
          next.textContent = t('next');
          body.innerHTML = '<p>' + U.esc(t('selectBackupFile')) + '</p>' +
            '<button class="btn" id="rw-pick">' + t('selectBackupFile') + '</button>';
          body.querySelector('#rw-pick').addEventListener('click', () => fileInput.click());
        };
        fileInput.addEventListener('change', () => {
          const f = fileInput.files[0];
          if (!f) return;
          fileInput.value = '';
          U.readFileText(f).then(txt => {
            try {
              backup = JSON.parse(txt);
            } catch (e) {
              body.innerHTML = '<div class="field-error">' + U.esc(t('backupInvalid', { msg: 'JSON' })) + '</div>';
              return;
            }
            validation = Backup.validate(backup);
            compat = validation.ok ? Backup.compat(backup) : { ok: false };
            stepInspect();
          });
        });
        const stepInspect = () => {
          next.disabled = !validation.ok;
          if (!validation.ok) {
            body.innerHTML = '<div class="field-error">' + U.esc(t('backupInvalid', { msg: validation.msg })) + '</div>' +
              '<button class="btn mt-2" id="rw-again">' + t('selectBackupFile') + '</button>';
            body.querySelector('#rw-again').addEventListener('click', stepSelect);
            return;
          }
          const inv = backup.inventory || {};
          body.innerHTML =
            '<div class="pill p-ok mb-2">' + U.esc(t('backupValid')) + '</div>' +
            '<div class="kv">' +
            '<div>' + t('backupFormatVersion') + '</div><div>' + backup.formatVersion + '</div>' +
            '<div>' + t('version') + '</div><div>' + U.esc(backup.appVersion || '?') + '</div>' +
            '<div>' + t('schemaVersion') + '</div><div>' + backup.data.meta.schemaVersion + '</div>' +
            '<div>' + t('date') + '</div><div>' + Cal.formatTimestamp(backup.createdAt, I18N.getLang()) + '</div>' +
            '</div>' +
            '<h4 class="mt-2">' + t('backupInventory') + '</h4>' +
            '<table class="table"><thead><tr><th>' + t('module') + '</th><th>' + t('count') + '</th></tr></thead><tbody>' +
            Object.keys(inv).map(k => '<tr><td>' + U.esc(k) + '</td><td>' + inv[k] + '</td></tr>').join('') +
            '</tbody></table>';
          next.disabled = false;
          next.onclick = () => { stepCompat(); };
        };
        const stepCompat = () => {
          if (!compat.ok) {
            body.innerHTML = '<div class="field-error">' + U.esc(t('backupIncompatible') + ' (' + compat.msg + ')') + '</div>' +
              '<button class="btn mt-2" id="rw-again">' + t('selectBackupFile') + '</button>';
            body.querySelector('#rw-again').addEventListener('click', stepSelect);
            next.disabled = true;
            return;
          }
          body.innerHTML = '<div class="pill p-ok mb-2">' + U.esc(t('backupValid')) + '</div>' +
            '<p>' + U.esc(compat.migration ? t('migrationRequired', { from: compat.from, to: compat.to }) : t('patchCompat') + ': OK') + '</p>' +
            '<p class="muted">' + U.esc(t('restoreConfirm')) + '</p>';
          next.textContent = t('restoreBackup');
          next.onclick = () => {
            UI.confirm(t('restoreConfirm'), () => { stepRestore(); }, true);
          };
        };
        const stepRestore = () => {
          next.disabled = true;
          body.innerHTML = '<p>' + U.esc(t('checkpointCreated')) + '</p><p>' + U.esc(t('saving')) + '…</p>';
          setTimeout(() => {
            try {
              const res = Backup.restore(backup);
              body.innerHTML = '<div class="pill p-ok mb-2">' + U.esc(t('restoreDone')) + '</div>' +
                '<p>' + U.esc(t('restoreVerify')) + '</p>' +
                '<div class="kv">' + Object.keys(res.counts).map(k => '<div>' + U.esc(k) + '</div><div>' + res.counts[k] + '</div>').join('') + '</div>' +
                (res.migrated ? '<p class="muted mt-1">' + U.esc(t('migrationRequired', { from: compat.from, to: compat.to })) + '</p>' : '') +
                '<p class="muted mt-1">' + U.esc(t('unknownFieldsPreserved')) + '</p>';
              next.textContent = t('ok');
              next.disabled = false;
              next.onclick = () => { close(); Auth.restoreSession(); UI.nav('dashboard'); };
            } catch (e) {
              body.innerHTML = '<div class="field-error">' + U.esc(t('restoreFailed', { msg: e.message || e })) + '</div>' +
                '<p class="muted">' + U.esc(t('recoveryBackup')) + '</p>' +
                '<button class="btn mt-2" id="rw-again">' + t('selectBackupFile') + '</button>';
              body.querySelector('#rw-again').addEventListener('click', stepSelect);
            }
          }, 60);
        };
        stepSelect();
      }
    });
    return modal;
  }
});

      installed.forEach(p => {
        const active = p.active !== false && !!Store.state.activePatchPayloads[p.id] && Store.state.activePatchPayloads[p.id].active !== false;
        html += '<tr><td>' + U.esc(p.id) + '</td><td>' + U.esc(p.version) + '</td><td>' + (active ? t('active') : t('inactive')) + '</td>' +
          '<td class="btn-row">' + (active
            ? '<button class="btn btn-sm" data-deact="' + U.esc(p.id) + '">' + t('patchDeactivate') + '</button>'
            : '<button class="btn btn-sm" data-react="' + U.esc(p.id) + '">' + t('patchActivate') + '</button>') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    return html;
  },
  bind() {
    document.querySelectorAll('[data-roll]').forEach(b => b.addEventListener('click', () => {
      UI.confirm(t('patchRollback') + '?', () => {
        try { PatchCenter.rollback(b.dataset.roll); UI.toast(t('patchRolledBack'), 'success'); UI.render(); }
        catch (e) { UI.toast(e.message || e, 'error'); }
      }, true);
    }));
    document.querySelectorAll('[data-deact]').forEach(b => b.addEventListener('click', () => {
      try { PatchCenter.deactivate(b.dataset.deact); } catch (e) { UI.toast(e.message || e, 'error'); }
    }));
    document.querySelectorAll('[data-react]').forEach(b => b.addEventListener('click', () => {
      try { PatchCenter.reactivate(b.dataset.react); } catch (e) { UI.toast(e.message || e, 'error'); }
    }));
    const pick = document.getElementById('pc-pick');
    let fileInput = document.getElementById('pc-file');
    if (!fileInput) {
      fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.id = 'pc-file';
      fileInput.accept = '.json,application/json';
      fileInput.style.display = 'none';
      document.body.appendChild(fileInput);
    }
    pick.addEventListener('click', () => fileInput.click());
    fileInput.onchange = () => {
      const f = fileInput.files[0];
      if (!f) return;
      fileInput.value = '';
      U.readFileText(f).then(txt => {
        const box = document.getElementById('pc-inspect');
        let pkg = null;
        try { pkg = JSON.parse(txt); } catch (e) {
          box.innerHTML = '<div class="field-error">' + U.esc(t('patchBadFormat')) + '</div>';
          return;
        }
        const val = PatchCenter.validate(pkg);
        const compat = val.ok ? PatchCenter.compat(pkg) : { ok: false };
        const conflicts = val.ok && compat.ok ? PatchCenter.conflicts(pkg) : { ok: true };
        const trusted = pkg && PatchCenter.TRUSTED_PUBLISHERS.includes(pkg.publisher);
        const allOk = val.ok && compat.ok && conflicts.ok;
        let html = '<div class="kv">';
        if (pkg) {
          [['id', pkg.id], ['name', pkg.name], ['version', pkg.version], ['patchPublisher', pkg.publisher], ['patchCompat', (pkg.minAppVersion || '?') + ' … ' + (pkg.maxAppVersion || '∞')], ['patchDeps', (pkg.dependencies || []).join('، ') || '—'], ['patchConflicts', (pkg.conflicts || []).join('، ') || '—']]
            .forEach(([k, v]) => { html += '<div>' + U.esc(t(k)) + '</div><div>' + U.esc(String(v == null ? '—' : v)) + '</div>'; });
        }
        html += '</div>';

/* ===== 90-boot.js ===== */
/* ===== window.Atlas extension API + boot sequence ===== */
window.Atlas = {
  version: APP_VERSION,
  schemaVersion: SCHEMA_VERSION,
  /* shared module access for patches */
  Store, UI, I18N, U, Cal, Widgets, Charts,
  Auth, Perms, Org, Employees, Users, Roles,
  Workflow, Priorities, Notifications,
  Projects, Tasks, Search, Reports,
  Migrations, Backup, PatchCenter, SaveSys,
  TaskViews, ProjectViews, EmployeeViews, AdminViews,
  t: (k, p) => t(k, p),
  sha256: s => SHA256(s),

  registerModule(mod) {
    if (!mod || !mod.id) throw new Error('registerModule: id required');
    if (!Perms.MODULES.some(m => m.id === mod.id)) {
      Perms.MODULES.push({ id: mod.id, ops: mod.ops || ['view'] });
      Store.state.roles.forEach(role => {
        if (role.id === 'role-admin' || role.id === 'role-orgadmin') {
          role.perms[mod.id] = role.perms[mod.id] || {};
          (mod.ops || ['view']).forEach(op => { role.perms[mod.id][op] = 'all'; });
        }
      });
      Store.markDirty();
    }
    return { ok: true, id: mod.id };
  },

  registerView(view) {
    if (!view || !view.id || typeof view.render !== 'function') throw new Error('registerView: invalid view');
    UI.registerView(view);
    if (view.icon) UI.iconMap[view.id] = view.icon;
    UI.render();
    return { ok: true, id: view.id };
  },

  registerReport(def) {
    if (!def || !def.id || typeof def.run !== 'function') throw new Error('registerReport: invalid report');
    Reports._extra = Reports._extra || [];
    Reports._extra = Reports._extra.filter(r => r.id !== def.id);
    Reports._extra.push(def);
    return { ok: true, id: def.id };
  },

  registerStatus(kind, status) {
    const list = Store.state.statuses[kind];
    if (!Array.isArray(list)) throw new Error('registerStatus: kind ' + kind);
    if (!list.some(s => s.id === status.id)) list.push(status);
    Store.markDirty();
    return { ok: true };
  }
};

/* make report definitions extensible without touching base logic */
(function () {
  const baseDefs = Reports.definitions.bind(Reports);
  Reports.definitions = function () {
    return baseDefs().concat((this._extra || []).map(d => ({ id: d.id, key: d.key || d.id })));
  };
  const baseRun = Reports.run.bind(Reports);
  Reports.run = function (id, filters) {
    const extra = (this._extra || []).find(r => r.id === id);
    if (extra) return extra.run(filters || {});
    return baseRun(id, filters);
  };
})();

/* icon map is extensible for patch-registered views */
UI.iconMap = {};
UI.iconFor = (function (orig) {
  return function (id) { return this.iconMap[id] || orig(id); };
})(UI.iconFor.bind(UI));

(function boot() {
  /* 1. capture the pristine template BEFORE any DOM mutation so saves embed clean app code */
  SaveSys.captureTemplate();

  /* 2. load state: localStorage first, then embedded data, then fresh */
  Store.init();

  /* 3. locale + theme */
  I18N.setLang(Store.state.settings.language);
  document.documentElement.dataset.theme = Store.state.settings.theme || 'simple';

  /* 4. session restore */
  Auth.restoreSession();

  /* 5. reactivate installed patch payloads (from state; embedded patch script is only a transport) */
  const payloads = Store.state.activePatchPayloads || {};
  Object.keys(payloads).forEach(pid => {
    if (payloads[pid].active === false) return;
    try {
      PatchCenter.activate(pid, { js: payloads[pid].js, css: payloads[pid].css });
    } catch (e) {
      console.error('patch activation failed at boot:', pid, e);
      const rec = (Store.state.meta.installedPatches || []).find(p => p.id === pid);
      if (rec) rec.active = false;
      delete Store.state.activePatchPayloads[pid];
      Store.state.patchHistory.push({
        id: pid, name: pid, version: (payloads[pid] && payloads[pid].version) || '?',
        publisher: '—', installedAt: U.nowISO(), installedBy: null,
        result: 'bootFailed', schemaAfter: Store.state.meta.schemaVersion, rollbackAvailable: false
      });
      Store.persist();
    }
  });

  /* 6. hash routing */
  function applyHash() {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const [viewId, q] = h.split('?');
    if (UI.views[viewId]) {
      const params = {};
      if (q) new URLSearchParams(q).forEach((v, k) => { params[k] = v; });
      UI.route = { view: viewId, params };
    }
  }
  window.addEventListener('hashchange', () => {
    applyHash();
    UI.render();
  });
  applyHash();

  /* 7. first paint */
  UI.render();

  /* 8. autosave */
  SaveSys.scheduleAutosave();

  /* 9. recovery prompt: localStorage state newer than portable save */
  const lastPortable = Store.state.meta.lastPortableSave;
  if (lastPortable && Store.lastSavedAt && Store.lastSavedAt > lastPortable && Auth.currentUser()) {
    UI.modal({
      title: t('recoverPrompt'),
      body: '<p>' + U.esc(t('dirtyWarning')) + '</p><p class="muted small">' + U.esc(t('lastSaved') + ': ' + Cal.formatTimestamp(Store.lastSavedAt, I18N.getLang())) + '</p>',
      foot: '<button class="btn" data-close>' + t('recoverNo') + '</button>' +
        '<button class="btn btn-primary" id="rc-yes">' + t('recoverYes') + '</button>',
      onMount(el, close) {
        el.querySelector('#rc-yes').addEventListener('click', () => {
          close();
          SaveSys.save();
        });
      }
    });
  }
})();

      return { adminUsername: 'admin', adminPassword: opts.adminPassword || 'atlas1234' };
    } finally {
      Perms.systemMode = prevSystemMode;
    }
  }
};

</script>
